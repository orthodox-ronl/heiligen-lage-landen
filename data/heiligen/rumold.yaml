betekenis_lage_landen: |
  Rumold is de stadsheilige van Mechelen. De relieken in de
  Sint-Romboutskathedraal en de middeleeuwse vita (*Passio Sancti Rumoldi*,
  elfde eeuw, Diederik van Sint-Truiden) maken hem tot een van de
  hoofdfiguren van de Vlaamse heiligenverering. Hoe legendarisch het
  levensverhaal ook is: de cultus is lokaal, oud en aan Mechelen gebonden.
verhaal: |
  De elfde-eeuwse vita maakt van Rumold een Ierse koningszoon en bisschop
  van Dublin die naar Rome ging en in Mechelen predikte; latere versies
  (vanaf circa 1300, en zestiende eeuw) voegen een marteldood door roverij
  toe. Betrouwbare contemporaine bronnen ontbreken. De traditionele
  sterfdatum 775 duikt pas in de dertiende eeuw op.

  Onderzoek aan de relieken (1974 en 2004) wijst op een man van 35–40 jaar
  die met grote waarschijnlijkheid tussen 580 en 655 stierf — eerder zevende
  dan achtste eeuw. Dat past bij Ierse en Angelsaksische missie in de Lage
  Landen, maar bewijst niet dat de beenderen «de» Rumold van de legende
  zijn; wel dat de vereerde dode vroeg en belangrijk was. Dit kalenderstuk
  volgt die voorzichtigheid: de cultus is historisch; de Ierse bisschop
  en het jaartal 775 zijn overlevering.
