betekenis_lage_landen: |
  Bernulphus (Bernold) was rijksbisschop van Utrecht onder Koenraad II
  en Hendrik III. Onder hem groeide het Oversticht (Hamaland, Salland,
  Drenthe, Deventer). Hij stichtte of herbouwde Pieterskerk, Janskerk
  en Paulusabdij in Utrecht en de Lebuïnuskerk in Deventer. Daarmee
  hoort hij tot de kern van de middeleeuwse Utrechtse kerk — westers
  episcopaat in de Lage Landen, maar lokaal onmisbaar.
verhaal: |
  Over herkomst bestaat weinig zekerheid; legendes verbinden hem met
  Oosterbeek. Rond 1027 tot bisschop benoemd. Hij bleef loyaal aan het
  keizerhuis en ontving graafschappen en goederen. Hij gold als
  kerkenbouwer: Pieterskerk en Janskerk te Utrecht, Lebuïnuskerk te
  Deventer. Overleden 19 juli 1054; begraven in de Pieterskerk.
  Gedenkdagtradities verschillen (19 of 24 juli); deze kalender volgt
  24 juli. Het 19e-eeuwse Sint-Bernulphusgilde koos hem tot patroon van
  kerkelijke kunst.
