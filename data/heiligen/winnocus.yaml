betekenis_lage_landen: |
  Winnocus werkte in historisch Vlaanderen: monnik onder Bertinus te
  Sithiu (Saint-Omer), daarna stichter/leider van de cel te Wormhout —
  missiepost voor de streek. Relieken gingen later naar Bergues
  (Winoksbergen). Het gebied ligt nu in Frankrijk; de historische
  Vlaamse context is reëel.
verhaal: |
  Winnoc (rond 640–716/717) kwam met gezellen naar Vlaanderen, trad in
  te Sithiu onder Bertinus en werd naar Wormhout gezonden om een
  afhankelijke stichting te leiden. Legenden vertellen van een handmolen
  die vanzelf maalde terwijl hij bad (patroon van molenaars). Hij stierf
  op 6 november; in 899 gingen relieken naar Bergues, waar later de abdij
  Saint-Winnoc ontstond. Vitae vanaf de negende eeuw (Bertin).
