betekenis_lage_landen: |
  Floribert volgt Hubertus op als bisschop van het bisdom
  Tongeren-Maastricht-Luik (vanaf 727). Zijn zetel en graf hoorden bij
  de Sint-Lambertuskathedraal te Luik. Daarmee staat hij in de lijn van
  de Maaslandse bisschoppen die de kerk van de zuidelijke Lage Landen
  organiseerden.
verhaal: |
  Volgens de traditie zoon van Hubertus van Luik. Bisschop vanaf 727;
  betrokken bij elevaties (o.a. Oda van Amay, Landoaldus te
  Wintershoven). Overleden 25 of 27 april, ca. 736/746; begraven te
  Luik. Historische steun: Chrodoara-sarcofaag te Amay en (latere)
  zegeltraditie als «Florbert Traiectensis».
