betekenis_lage_landen: |
  Albericus maakte van Utrecht een gevestigd bisdom na de missietijd van
  Willibrord en Gregorius. Hij steunde Ludgers werk in Friesland en wordt
  traditioneel in Susteren begraven — kernfiguur van de Utrechtse kerk in
  de Lage Landen.
verhaal: |
  Benedictijn, eerder abt van Sint-Maarten te Keulen; volgde zijn oom
  Gregorius op als bestuurder van Utrecht. Omstreeks 777 in Keulen tot
  bisschop gewijd; contacten met het hof van Karel de Grote en Alcuinus.
  Hij stierf in 784. Relieken worden in de Sint-Amelbergakerk te Susteren
  bewaard. Gedenkdagen wisselen (o.a. 14 november, 4 maart).
