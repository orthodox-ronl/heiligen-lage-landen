betekenis_lage_landen: |
  Wiro is de stichterheilige van Sint Odiliënberg bij Roermond: met
  Plechelmus en Otger bouwde hij op land van Pepijn van Herstal een
  Sint-Pietersklooster. De Maas-Limburgse cultus (basiliek, Roermond,
  vroeger ook Utrecht) maakt hem een vaste heilige van de noordelijke
  Lage Landen, ondanks legendaire vita-details.
verhaal: |
  De oudste vita (vermoedelijk negende eeuw) noemt Wiro uit Scotia
  (Ierland). Rond 700 predikte hij met Plechelmus en Otger in Maas- en
  Rijnstreek en stichtte het klooster te Berg (nu Sint Odiliënberg).
  Verbinding met Willibrord is later toegevoegd. Hij stierf in de achtste
  eeuw; grafvondst bij kerkbouw in 1881. Algemeen feest 8 mei; in
  Roermond 11 mei (deze kalender volgt die lokale datum).
