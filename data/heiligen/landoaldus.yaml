betekenis_lage_landen: |
  Landoaldus predikte in de Haspengouw, stichtte een kerk te
  Wintershoven (Belgisch Limburg) en was volgens de traditie leermeester
  van Lambertus. Floribert verhief zijn relieken. Dat is missie en
  kerkstichting in huidig België, zevende eeuw.
verhaal: |
  Landoaldus kwam volgens de overlevering met Amandus uit Rome mee
  naar het gebied tussen Maas en Schelde. Hij diende Remaclus en Theodaard
  en zou Lambertus hebben opgevoed. Rond 659 stichtte hij een
  Petruskerkje te Wintershoven. Hij stierf omstreeks 668. Metgezellen
  (onder meer de diaken Amantius en zijn zuster Vinciana) horen bij de
  Heiligen van Wintershoven; Landoaldus is de kernfiguur. In 980 gingen
  relieken naar de Sint-Baafsabdij te Gent.
over_bronnen: |
  Landoaldus voldoet: prediking en kerkstichting te Wintershoven in
  huidig België, ca. 659–668 ([1], [2], [3]). De Wintershovense
  gezellen hebben geen eigen pagina: hun historiciteit is dunner; zij
  worden in dit verhaal genoemd. Lambertus en Floribert hebben wel een
  eigen pagina.
