betekenis_lage_landen: |
  Landrada stichtte het klooster Munsterbilzen in Belgisch Limburg
  en was er eerste abdis. Amalberga van Temse zou er haar vorming hebben
  gekregen. Dat is kloosterstichting in huidig België, zevende eeuw.
verhaal: |
  Landrada leefde als kluizenares tot zij te Munsterbilzen een
  klooster stichtte. Lambertus zou de kapel hebben ingezegend en haar
  later de laatste sacramenten hebben toegediend. Zij stierf omstreeks
  690. Relieken gingen later naar Gent.
over_bronnen: |
  Landrada voldoet: stichting en bestuur van Munsterbilzen in huidig
  België, † ca. 690 ([1], [2], [3]). Vlaamse bisdomkalender 8 juli ([4]).
