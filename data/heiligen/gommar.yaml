betekenis_lage_landen: |
  Gommar (Gummarus) is de stadsheilige van Lier: rond zijn kluizenarij
  Nivesdonck groeide de stad. De cultus (verheffing ca. 815, kapittel,
  processie) maakt hem een vaste Brabantse heilige van de Lage Landen,
  los van de late en legendarische details van zijn huwelijksvita.
verhaal: |
  Volgens de overlevering kwam Gommar uit Emblem bij Lier en diende aan
  het hof van Pepijn de Korte. Na een moeilijk huwelijk (Grimmara) trok
  hij zich terug als kluizenaar te Nivesdonck — het latere Lier — en
  stichtte er met Rumold van Mechelen een Petruskerk. De geschreven vita
  is laat (elfde eeuw); chronologische spanning met Rumold blijft
  bestaan. Hij stierf rond 775; feestdag 11 oktober.
