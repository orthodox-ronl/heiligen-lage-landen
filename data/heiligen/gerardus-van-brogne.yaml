betekenis_lage_landen: |
  Gerardus stichtte de abdij van Brogne bij Namen en herstelde de
  Benedictijnse tucht in onder meer Saint-Ghislain, de Sint-Pietersabdij
  en de Sint-Baafsabdij te Gent. Dat is kloosterbestuur in huidig België,
  ruim vóór het schisma.
verhaal: |
  Gerardus werd rond 890 geboren te Stave bij Namen, diende aan het
  hof van de graaf van Namen en werd monnik te Saint-Denis. In 923 keerde
  hij terug en vormde Brogne om tot benedictijnenabdij. Graaf Arnulf I van
  Vlaanderen haalde hem naar Gent; hij hervormde daar Sint-Pieters en
  Sint-Baafs, en verder onder meer Saint-Ghislain. Hij stierf in 959 als
  kluizenaar en werd in Brogne begraven. De pauselijke heiligverklaring
  van 1131 bevestigt een oudere lokale cultus.
over_bronnen: |
  Gerardus voldoet aan het criterium: hij is vóór 1054 in huidig
  België geweest en heeft daar kloosters gesticht en hervormd. Geboorte
  bij Namen, stichting van Brogne en hervorming van de Gentse abdijen
  staan in [1], [2] en [3]. Sterfjaar 959 ([1], [4]). De heiligverklaring
  van 1131 is later; voor pre-schisma-heiligen telt het werk en de
  plaatselijke verering, niet die Romeinse procedure.
