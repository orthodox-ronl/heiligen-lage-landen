betekenis_lage_landen: |
  Benedicta en Cecilia waren volgens de overlevering dochters van
  Zwentibold en werden te Susteren (Nederlands Limburg) door Amalberga
  opgevoed. Beiden werden abdis van het vrouwenstift. Hun relieken
  werden in Susteren vereerd — kloosterbestuur in huidig Nederland,
  vóór het schisma.
verhaal: |
  Na de Vikingverwoesting van Susteren herstelde Zwentibold het stift.
  Benedicta en Cecilia traden in; Benedicta volgde Amalberga op als
  abdis, Cecilia daarna. (Een derde zuster, Relindis van Susteren, leefde
  als reclusa bij Luik — niet te verwarren met Relindis van Aldeneik.)
  Feestdag 17 augustus. Historische bewijzen voor het abbatiaat zijn
  dun; de Susterense cultus is de vaste kern.
over_bronnen: |
