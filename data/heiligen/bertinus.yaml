selectie_toelichting: "Abt van Sithiu; Sint-Omaars nu in Frankrijk."
selectie_toelichting_publiek: |
  **Voor.** Bertinus was abt van Sithiu (Sint-Bertijns) en werkte met
  Audomarus in de kerstening van de streek. Vlaamse kalender 5 september.

  **Twijfel.** Sithiu/Sint-Omaars ligt nu in Frankrijk. Zelfde grens als
  Audomarus en Folciunus.
