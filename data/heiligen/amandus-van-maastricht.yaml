betekenis_lage_landen: |
  Amandus is een van de centrale Merovingische missionarissen van de
  Lage Landen: Gent (Sint-Pieters, Sint-Baafs), Elno (Saint-Amand-les-
  Eaux bij Doornik) en enkele jaren de Maastrichter zetel. Zijn werk
  vormde de kerkelijke kaart van Vlaanderen en het Maasland vóór de
  Angelsaksische missie.
verhaal: |
  Geboren bij Nantes (~600), monnik en kluizenaar, tot missiebisschop
  gewijd. Predikte in Vlaanderen, stichtte kloosters te Gent en Elno.
  Door Dagobert tijdelijk verbannen na kritiek; later kort bisschop van
  Maastricht (~647–650), daarna weer zwervend. Stierf te Elno (~675/684).
  Vroege vita; uitzonderlijk goed gedocumenteerd voor de zevende eeuw.
