betekenis_lage_landen: |
  Bavo (Allowin) is de stadsheilige van Gent. De overlevering maakt hem tot
  een bekeerde edelman die onder Amandus tot inkeer kwam en als kluizenaar
  bij de Gentse abdij stierf. De Sint-Baafskathedraal draagt zijn naam.
  Een Heiligenlexikon-artikel is in deze ronde niet op een stabiele URL
  gevonden; tot die toets volgt de tekst Wikipedia.
verhaal: |
  Volgens de Nederlandse Wikipedia was Allowin een Brabantse edelman
  (zevende eeuw) die na de dood van zijn vrouw boete deed, door Amandus
  tot het kloosterleven werd gebracht en als kluizenaar bij Gent stierf
  (feestdag 1 oktober). Genealogische koppeling aan het huis van Nijvel
  (broer van Gertrudis) komt in overzichten voor maar is niet hard. Zonder
  vita-editie of lexikonartikel blijft dit beknopt.
