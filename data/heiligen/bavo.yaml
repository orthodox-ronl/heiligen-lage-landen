betekenis_lage_landen: |
  Bavo (Allowin) is de stadsheilige van Gent. De overlevering maakt hem tot
  een bekeerde edelman die onder Amandus tot inkeer kwam en als kluizenaar
  bij de Gentse abdij stierf. De Sint-Baafskathedraal draagt zijn naam.
verhaal: |
  Allowin was een Brabantse edelman (zevende eeuw) die na de dood van zijn
  vrouw boete deed, door Amandus tot het kloosterleven werd gebracht en als
  kluizenaar bij Gent stierf. Feestdag 1 oktober. Soms wordt hij als broer
  van Gertrudis van Nijvel genoemd.
over_bronnen: |
