betekenis_lage_landen: |
  Hilsondis is in de Thornse overlevering de gravin die, met Ansfried,
  de abdij van Thorn stichtte (Nederlands Limburg, tiende eeuw). Dat is
  kloosterstichting in huidig Nederland, ruim vóór het schisma. De
  liturgische gedachtenis te Thorn is 1 mei.
verhaal: |
  In de Thornse traditie is Hilsondis (ook Hilsundis, Hilsuindis;
  in oudere liturgie Herswindis/Hereswindis) gravin van Strijen, echtgenote
  van Ansfried en stichteres van het stift Thorn, rond de jaren 980–992.
  Ansfried, later bisschop van Utrecht, heeft een eigen pagina. Hun
  dochter wordt in latere bronnen Benedicta genoemd en eerste abdis; andere
  overleveringen maken Hilsondis zelf tot eerste abdis. Zij stierf omstreeks
  994 en werd te Thorn begraven.

  De namen zijn niet van meet af aan inwisselbaar. Herswindis is de
  oudere naam in de liturgische traditie: het Thornse ceremoniale Officia
  propria (rond 1700, naar ouder voorbeeld) noemt haar herhaaldelijk sancta
  en koppelt haar nagedachtenis aan die van Ansfried; haar tombe speelt in
  de lokale liturgie. Hilsondis verschijnt later prominent in politieke en
  stichtingsdocumenten (onder meer het grafschrift en het necrologium). In
  de Thornse traditie zijn beide namen uiteindelijk als dezelfde vrouw
  gaan functioneren.

  De duidelijker gedocumenteerde Thornse liturgische gedachtenis is
  1 mei: vernieuwde necrologia (1715) herdenken die dag de stichteres
  (fundatrix Hilsundis). 1 juni is de vermoedelijke of overgeleverde
  sterfdatum; die dag niet zonder voorbehoud als liturgische feestdag
  presenteren.
over_bronnen: |
  Hilsondis voldoet: stichting van Thorn in huidig Nederland, tiende
  eeuw, vóór het schisma ([1], [2], [3]).

  De feestdag op deze kalender is 1 mei, de Thornse necrologische
  gedachtenis van de stichteres ([2], met foto van het necrologium op
  1 mei). 1 juni blijft als extra dag genoteerd: overgeleverde sterfdatum,
  geen even duidelijk gedocumenteerde liturgische feestdag.

  Herswindis en Hilsondis: Jongbloed toont dat de oudere liturgie
  (Officia propria) Herswindis als heilige eert en van Hilsondis niets
  weet, terwijl latere stichtings- en grafteksten Hilsondis als fundatrix
  voeren ([2]). Habets en Flament identificeerden beide al met hetzelfde
  grafmonument; sindsdien is die identiteit in de Thornse traditie de
  regel ([2]). Jongbloed zelf opent de mogelijkheid van twee Ansfrieden
  en twee echtgenotes; voor deze kalender volgt de Thornse praktijk die
  de namen als één vrouw laat functioneren, met de naamgeschiedenis
  hierboven.

  De titel eerste abdis is later en niet eenduidig: het grafschrift en
  Egidius van Orval noemen de dochter (Benedicta) eerste abdis; andere
  bronnen Hilsondis zelf ([1], [2]). Het necrologium zegt fundatrix, niet
  abdis ([2]).
