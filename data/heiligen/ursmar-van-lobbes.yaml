betekenis_lage_landen: |
  Ursmar was abtbisschop van Lobbes (Henegouwen, België): hij bouwde
  de kloosterkerk, voerde de Benedictijnse regel in en predikte in de
  streek. Lobbes werd een van de kersteningcentra van het zuiden.
verhaal: |
  Ursmar, opgeleid in het klooster, werd door Landelinus tot priester
  gewijd en rond 689 abtbisschop van Lobbes. Hij bouwde de kerk die later
  zijn naam droeg (wijding 697) en trad rond 711 af ten gunste van Erminus.
  Hij stierf in 713 te Lobbes.
over_bronnen: |
  Ursmar voldoet: bestuur en prediking te Lobbes in huidig België,
  † 713 ([1], [2], [3]).
