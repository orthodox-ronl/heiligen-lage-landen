betekenis_lage_landen: |
  Ermelindis is een Brabantse kluizenares met cultuscentrum te Meldert
  (bij Hoegaarden/Tienen). Haar vita is legendair, maar de lokale
  bedevaart en kapellen (onder meer Lovenjoel) maken haar tot een
  vaste heilige van Vlaams-Brabant — typisch voor de heiligenkalender
  van de Lage Landen.
verhaal: |
  Van adellijke komaf (soms gekoppeld aan Pepijn van Landen). Zij
  weigerde huwelijk, leefde eerst bij Bevekom, vluchtte na een
  waarschuwing naar Meldert en stierf daar als kluizenares (traditie:
  ca. 47 jaar). Engelen zouden haar hebben begraven; later ontstond
  een kapel bij lichtwonderen op haar graf. Feestdag 29 oktober.
