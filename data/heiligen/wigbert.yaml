selectie_toelichting: "Prediking in Friesland (~2 jaar); weinig blijvend resultaat; keerde terug."
selectie_toelichting_publiek: |
  **Voor.** Wigbert (Victberct) predikte volgens Beda twee jaar onder de
  Friezen en koning Radboud — dus in huidig Nederland — op aandringen van
  Egbert van Rathmelsigi.

  **Twijfel.** Hij behaalde weinig resultaat en keerde terug naar Ierland.
  Zijn blijvende werk lag elders; de Friese missie werd later door
  Willibrord voortgezet. Deur open; geen actieve verzameling van dit
  type grensgevallen.
