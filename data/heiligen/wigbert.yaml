betekenis_lage_landen: |
  Wigbert predikte twee jaar in Friesland (huidig Nederland) vóór de
  grote missie van Willibrord. Het resultaat bleef beperkt; hij keerde
  terug naar Ierland. De band met de Lage Landen is reëel maar kort en
  zonder blijvende stichting.
verhaal: |
  Angelsaksische monnik, leerling van Egbert in Ierland. Na Egberts
  eigen mislukte plan zond deze Wigbert naar de Friezen. Twee jaar
  prediking onder Radboud leverde volgens Beda geen bekeringen op;
  Wigbert keerde terug en stierf in Ierland (~690). Niet te verwarren
  met Wigbert van Fritzlar (Bonifatius-kring; feestdag 13 augustus).
over_bronnen: |
  Prediking in Frisia is bij Beda hard ([1], [2]). Selectie nader
  onderzoek: kort verblijf, geen blijvend resultaat.
