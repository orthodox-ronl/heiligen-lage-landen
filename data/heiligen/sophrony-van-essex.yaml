betekenis_lage_landen: |
  Sophrony heeft in de Lage Landen zelf gehandeld, niet alleen via zijn
  geschriften. Op 14 september 1980 ging hij voor in de Goddelijke Liturgie
  in de parochie van de apostel Andreas te Gent en sprak met de parochianen
  (aartsbisdom België, jubileum 2022). De kerk daar is later mede aan hem
  toegewijd.

  Moeder Maria, eerste abdis van het klooster in Asten (1989), getuigt in
  een interview op de kloosterwebsite dat zij hem in Essex ontmoette bij
  haar terugkeer naar Nederland. Hij was niet haar geestelijke vader, maar
  de ontmoeting was «heel belangrijk». Zijn raad: woon niet als moniale bij
  een parochie; zoek ruimte om te bouwen. Dat is haar eigen getuigenis,
  geen onafhankelijke derde.
verhaal: |
  Sergej Simeonovitsj Sacharov werd op 23 september 1896 in Rusland geboren.
  Na kunststudie en een periode buiten de Kerk keerde hij in 1924 in Parijs
  tot het christendom terug, werd monnik op de Athos (Sophrony, 1926) en
  leerling van Silouan de Athoniet. Na Silouans ontslapen (1938) leefde hij
  als kluizenaar; in 1947 ging hij naar Parijs en gaf Silouans geschriften
  uit.

  In 1959 stichtte hij het klooster van Johannes de Doper te Tolleshunt
  Knights (Essex), later stavropegisch onder het Oecumenisch Patriarchaat.
  Hij ontsliep op 11 juli 1993. Het Oecumenisch Patriarchaat verheerlijkte
  hem op 27 november 2019. OrthodoxWiki is de bron voor dit levensoverzicht;
  de band met Gent en Asten staat in de kerkelijke bronnen hieronder.
