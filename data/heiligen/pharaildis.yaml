betekenis_lage_landen: |
  Pharaïldis (Veerle) is een Gentse heilige van de achtste eeuw:
  maagd, met een sterke lokale cultus in Vlaanderen. De traditie maakt
  haar tot zuster van Gudula.
verhaal: |
  Volgens de overlevering was Pharaïldis een dochter uit het
  Brabantse heiligengeslacht (Gudula, Reinildis). Zij leefde als
  godvruchtige vrouw in de Gentse streek en stierf omstreeks 750. Haar
  feestdag is 4 januari op de Vlaamse kalender.
over_bronnen: |
  Pharaïldis voldoet: leven en cultus in Gent/Vlaanderen, † ca. 750
  ([1], [2], [3]). De genealogische koppeling aan Gudula is traditioneel,
  niet contemporain bewezen; het verblijf in de Gentse streek is de
  opnamegrond.
