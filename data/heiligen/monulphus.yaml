betekenis_lage_landen: |
  Monulphus maakte het graf van Servatius tot een stenen kerk — de kern
  van de latere Sint-Servaasbasiliek. Gregorius van Tours noemt die
  *templum magnum* nog in de zesde eeuw. Daarmee is Monulphus de bouwer
  die de Maaslandse bisschopsstad een duurzaam heiligencentrum gaf, na
  Servatius en vóór Lambertus en Hubertus.
verhaal: |
  Weinig is zeker. Het Heiligenlexikon schrijft hem de stenen kerk boven
  het graf van Servatius toe, en noemt (zonder dezelfde zekerheid) een
  kapel voor Cosmas en Damianus te Luik en een Egidiusgasthuis in
  Maastricht. Sterfjaar traditioneel circa 599. In 1039 werden zijn
  relieken, samen met die van Gondulphus, verheven in aanwezigheid van
  keizer Hendrik III.

  Latere vitae zijn niet ouder dan de elfde eeuw. Of hij de zetel van
  Tongeren naar Maastricht verlegde, blijft een toeschrijving in de
  bisschoppenlijsten. Hij deelt de feestdag 16 juli met Gondulphus; of
  dat twee personen zijn of één dubbel overgeleverde naam, is in de
  oudere katholieke encyclopedie al als vraag gesteld. Deze kalender
  houdt twee ids aan, omdat de cultus hen als paar eert.
