betekenis_lage_landen: |
  Fridolin hoort in oudere catalogi van «heiligen van de Lage Landen», maar
  zijn werk lag aan de Boven-Rijn (Säckingen, Glarus, Elzas). Er is geen
  aantoonbare missie of cultuskern in het huidige NL/BE/LUX.
verhaal: |
  De middeleeuwse vita (Balther van Säckingen, ca. 970) tekent Fridolin als
  Ierse edele die via Poitiers (Hilarius) naar Alemannië trok en op het
  Rijneiland Säckingen een dubbelklooster stichtte. Historici plaatsen de
  historische kern eerder in de zevende eeuw dan bij het traditionele
  sterfjaar 538. Bekend is het latere Urso-wonder (schenking van Glarus).
  Relieken en cultus leven in Bad Säckingen en het Zwitserse kanton Glarus;
  een band met de Lage Landen ontbreekt.
