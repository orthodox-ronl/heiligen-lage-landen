betekenis_lage_landen: |
  Gregorius maakte de Utrechtse school tot missiecentrum voor Friezen,
  Saksen en anderen; uit die school kwam onder meer Ludger. Na de dood
  van Bonifatius en Eoban (754) bestuurde hij het bisdom zonder
  bisschopswijding. Zijn vita door Ludger verbindt de Pippiniden-missie
  met de kerk van de noordelijke Lage Landen.
verhaal: |
  Gregorius stamde uit Frankische adel rond Trier/Pfalzel en sloot zich
  als jongeling bij Bonifatius aan (Hessen, Thüringen, Rome 737/738).
  Omstreeks 747 werd hij abt van Sint-Maarten in Utrecht. Na 754
  leidde hij de Friese missie en het bisdom; bisschop was formeel de
  Angelsaks Alubert. Hij stierf op 25 augustus 775 (of 776). Ludger
  schreef zijn levensbeschrijving; een kopreliek rust in Susteren.
