betekenis_lage_landen: |
  Adelgondis is een lokale Gentse/Vlaamse heilige: haar verhaal speelt in
  Drongen aan de Leie, in de tijd van Amandus’ prediking. Glasramen in de
  Sint-Gerulfuskerk houden de cultus levend. Niet te verwarren met
  Aldegonda van Maubeuge.
verhaal: |
  Volgens de overlevering was zij blind geboren als enig kind van koning
  Basinus. Op het feest van Johannes de Doper reed zij naar de door haar
  vader gestichte kerk aan de Leie en werd ziende; elders keerde de
  blindheid terug tot zij zich voorgoed aan de kerk verbond. Zij schonk
  haar bezit weg en stierf als heilige (~650). Vroeger herdacht op
  26 januari; nu vaak op 20 juni. Niet historisch hard te maken, wel lokaal
  verankerd.
over_bronnen: |
