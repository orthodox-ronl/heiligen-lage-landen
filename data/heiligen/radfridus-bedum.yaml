betekenis_lage_landen: |
  Radfridus is de zoon van Walfridus van Bedum. Volgens de Passio
  werden beiden omstreeks 1000 door Noormannen gedood in het Friese
  land tussen Lauwers en Eems. Over zijn graf verrees een eigen
  bedevaartkapel (later een stenen kerk), westelijk van de
  Walfriduskerk. Hij hoort bij dezelfde Bedumse martelaarscultus als
  zijn vader, met eigen merites: eigen feestdagtraditie (3 december)
  en eigen cultusplaats.
verhaal: |
  De middeleeuwse Passio sanctorum martyrorum Walfridi et Radfridi
  maakt van Walfridus en zijn zoon Radfridus vrome landbouwers die
  moeras ontgonnen en als christenen leefden. Bij een Noormanneninval
  (omstreeks 1000) werden beiden vermoord. Het lichaam van Radfridus
  zou pas later in het riet zijn gevonden. Over zijn graf bouwde men
  een kapel; in de dertiende eeuw een bakstenen kerk van circa twintig
  meter. Die Radfriduskapel verdween omstreeks 1664.

  Walfridus heeft een eigen pagina. Radfridus staat hier op eigen
  merites als martelaar te Bedum met eigen cultusplaats.
over_bronnen: |
  Opname steunt op de Bedumse martelaarstraditie en de Meertens-
  bedevaartcatalogus voor H. Radfridus ([1], [2]). De Passio is laat
  (mogelijk 12e eeuw); jaartallen en details wisselen — dezelfde
  onzekerheid als bij Walfridus, die al als voldoet in de catalogus
  staat. Geen vrij herbruikbaar historisch icoon van Radfridus alleen
  gevonden; beeldmateriaal is de Bedumse cultusplaats.
