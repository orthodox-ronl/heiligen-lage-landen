selectie_toelichting: "Eerste bisschop van Keulen; Tongeren-band legendarisch."
selectie_toelichting_publiek: |
  **Voor.** De traditie maakt Maternus tot eerste bisschop van Tongeren
  én Keulen, deelnemer aan de concilies van Rome (313) en Arles (314).
  FSSPX zet hem op 14 september.

  **Twijfel.** Historisch is hij bisschop van Keulen. De Tongerense
  apostolaten zijn dezelfde soort late constructie als bij Quirillus van
  Tongeren (al nader onderzoek). Keulen is niet de Lage Landen.
