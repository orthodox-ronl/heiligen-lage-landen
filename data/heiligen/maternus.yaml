betekenis_lage_landen: |
  Maternus is historisch de eerste bekende bisschop van Keulen. Of
  hij in Tongeren werkte, is de open vraag, net als bij andere vroege
  Maaslandse bisschoppen.
verhaal: |
  Maternus wordt in 313 en 314 op concilies genoemd als bisschop van
  Keulen. Latere lijsten maken hem tot apostel van Tongeren. Feestdag
  14 september.
over_bronnen: |
  **Voor.** Vroege bisschop, concilies 313/314; Tongeren-traditie ([1],
  [2]).

  **Twijfel.** Zelfde dossier als Quirillus: Keulen is hard, Tongeren is
  legende ([1]).
