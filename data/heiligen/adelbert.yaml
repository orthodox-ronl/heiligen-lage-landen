betekenis_lage_landen: |
  Adelbert is de huisheilige van Egmond: metgezel van Willibrord, later
  vereerd in de abdij die boven zijn graf groeide. Daarmee is hij de
  schakel tussen de Friese missie en het Noord-Hollandse
  kloosterchristendom. De abdij van Egmond werd het geestelijk centrum
  van Holland; zijn cultus is daarvan de kiem.
verhaal: |
  Het Heiligenlexikon en de Nederlandse overlevering maken hem tot
  Angelsaksische aartsdiaken in het gevolg van Willibrord. Hij zou te
  Egmond hebben gepredikt en daar zijn begraven (circa 740). De abdij
  van Egmond ontstond in de tiende eeuw rond dat graf.

  Een zelfstandige vroege vita ontbreekt; veel rust op latere
  abdijoverlevering. Wat vaststaat is de middeleeuwse cultus te Egmond
  en de band met Willibrord in de heiligenkalenders van Holland.
