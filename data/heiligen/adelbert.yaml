betekenis_lage_landen: |
  Adelbert is de huisheilige van Egmond: metgezel van Willibrord, later
  vereerd in de abdij die boven zijn graf groeide. Daarmee is hij de
  schakel tussen de Friese missie en het Noord-Hollandse
  kloosterchristendom. De abdij van Egmond werd het geestelijk centrum
  van Holland; zijn cultus is daarvan de kiem.
verhaal: |
  Adelbert was Angelsaksische aartsdiaken in het gevolg van Willibrord.
  Hij predikte te Egmond en werd daar begraven (circa 740). De abdij van
  Egmond ontstond in de tiende eeuw rond dat graf; de middeleeuwse cultus
  bewaart zijn band met Willibrord.
over_bronnen: |
  Het verhaal rust vooral op latere abdijoverlevering; een zelfstandige
  vroege vita ontbreekt. Het Heiligenlexikon en heiligen.net bevestigen
  de Egmondse cultus.
