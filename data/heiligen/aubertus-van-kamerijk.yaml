betekenis_lage_landen: |
  Aubertus (Autbertus) bestierde het bisdom Atrecht-Kamerijk, dat tot
  in Henegouwen reikte. Hij stimuleerde missie en kloosterstichtingen
  (Sint-Vaast te Atrecht, Lobbes, Wallers, Crespin) die de vroegmiddeleeuwse
  kerk in het zuiden van de Lage Landen vormden. De zetel ligt nu in
  Frankrijk; de band met Vlaanderen/Henegouwen blijft.
verhaal: |
  Omstreeks 600 geboren, verwant aan Dagobert I; volgens de overlevering
  monnik in de kring van Luxeuil. Rond 633 bisschop van Atrecht en
  Kamerijk. Hij werkte samen met Eligius en gaf Landelinus opdracht tot
  kloosterstichtingen. Legende: tijdens hongersnood bakte hij brood en
  liet een ezel het in de stad brengen — vandaar patroon van bakkers.
  Overleden te Kamerijk op 13 december 669(?); herdenking in Gent op
  15 december.
