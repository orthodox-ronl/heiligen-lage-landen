betekenis_lage_landen: |
  Guido was koster te Laken, pelgrim, en stierf in 1012 te
  Anderlecht. Zijn graf in de kapittelkerk werd een Brussels
  bedevaartsoord. Werk en dood in huidig België, vóór het schisma.
verhaal: |
  Brabantse boerenzoon, koster van de Onze-Lieve-Vrouwekapel te Laken.
  Na een mislukte handelsperiode ondernam hij pelgrimstochten naar
  Jeruzalem en Rome. Hij stierf op 12 september 1012 te Anderlecht. Later
  wonderen bij zijn graf vestigden de cultus.
over_bronnen: |
