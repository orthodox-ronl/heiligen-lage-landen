selectie_toelichting: "Abdis van Tauberbischofsheim; werk in Germanië. Het Lioba-klooster in Egmond (1935) is later patroonschap."
selectie_toelichting_publiek: |
  Lioba werkte in Tauberbischofsheim en het Maingebied, in de kring van
  Bonifatius, niet in de Lage Landen. Het benedictijnse Lioba-klooster in
  Egmond-Binnen (1935) is naar haar genoemd; patroonschap van een klooster
  is volgens de criteria van deze kalender niet genoeg. Zij blijft hier
  als kandidaat staan tot een uitdrukkelijk besluit.
