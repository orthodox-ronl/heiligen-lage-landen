samenvatting: |
  Angelsaksische abdis van Tauberbischofsheim; verwante van Bonifatius.
  Feestdag 28 september.
betekenis_lage_landen: |
  Lioba (Leobgytha) leidde het vrouwenklooster dat Bonifatius in
  Tauberbischofsheim stichtte en vormde nonnen voor de Duitse missie.
  Er is geen aantoonbaar verblijf of werk in Nederland of België.
verhaal: |
  Lioba werd omstreeks 710 in Wessex geboren (doopnaam Truthgeba; Lioba
  is de kosenaam). Zij werd opgevoed in Thanet/Minster en in Wimborne
  (onder abdis Tetta; daar ook Walburga). Bonifatius, een verwant,
  riep haar omstreeks 735 naar Germanië; zij werd abdis van
  Tauberbischofsheim. Zij stierf in 782 op het hofgoed Schornsheim bij
  Mainz en werd bij Fulda begraven. Feestdag 28 september
  (Heiligenlexikon).
