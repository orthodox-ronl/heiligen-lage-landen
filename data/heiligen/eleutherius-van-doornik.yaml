betekenis_lage_landen: |
  Eleutherius was bisschop van Doornik (huidig België) in de vroege
  zesde eeuw. Dat is kerkbestuur in de zuidelijke Lage Landen, ruim vóór
  het schisma.
verhaal: |
  Eleutherius geldt als bisschop van Doornik; hij stierf in 531.
  Doornik was toen een belangrijke Frankische zetel. Zijn cultus hoort bij
  de kathedraal van Doornik.
