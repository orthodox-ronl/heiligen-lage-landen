betekenis_lage_landen: |
  Landelinus stichtte het klooster Lobbes in Henegouwen (België).
  Crespin (nu Frankrijk) hoort bij dezelfde stichtingsgolf; Lobbes is de
  Belgische kern.
verhaal: |
  Landelinus, bekeerde rover in de traditie, stichtte kloosters in
  de streek van de Hene, waaronder Lobbes (ca. 650) en Crespin. Hij
  wijdde Ursmar tot priester. Hij stierf in 654.
over_bronnen: |
  Landelinus voldoet door de stichting van Lobbes in huidig België
  ([1], [2]). Crespin ligt nu in Frankrijk; dat is dezelfde grens als bij
  Adelgonda, maar Lobbes weegt hier.
