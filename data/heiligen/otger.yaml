betekenis_lage_landen: |
  Otger hoort bij het drietal Angelsaksische (of Ierse) missionarissen dat
  omstreeks 700 het klooster op de Petrusberg stichtte, het huidige Sint
  Odiliënberg in Limburg. Zonder hem is de lokale kerstening van de
  Roerstreek onvolledig: Wiro en Plechelm staan al in deze kalender; Otger
  is de derde van dezelfde stichting. De basiliek draagt nog hun drie namen.
verhaal: |
  Het Heiligenlexikon noemt Otger diaken en geloofsverkondiger aan de
  Nederrijn en de Maas, werkzaam met Wiro en Plechelm, mogelijk in verband
  met Willibrord. Omstreeks 700 stichtten zij op land van Pepijn van
  Herstal het klooster te Berg (Sint Odiliënberg). Hij zou in de achtste
  eeuw daar zijn gestorven (traditioneel circa 750).

  De afstamming van Aubertus van Kamerijk is een vermoeden, geen vaststaand
  feit. Latere lokale vieringen op andere dagen (onder meer 8 mei voor het
  drietal samen, of 10 september) zijn in parochiebronnen te vinden; de
  feestdag in het Heiligenlexikon is 15 juli, dezelfde dag als Plechelm in
  deze kalender.
