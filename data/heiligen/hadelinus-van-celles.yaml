betekenis_lage_landen: |
  Hadelinus stichtte of bestuurde het klooster Celles bij Dinant
  (België). Relieken en cultus te Wezet (Visé).
verhaal: |
  Hadelinus, leerling in de kring van Remaclus, vestigde zich in de
  zevende eeuw te Celles in de Maasvallei. Hij stierf omstreeks 690.
  Zijn reliekschrijn te Wezet is een bekend Maaslands kunstwerk.
over_bronnen: |
