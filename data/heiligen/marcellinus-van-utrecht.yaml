betekenis_lage_landen: |
  Marcellinus (Marchelm/Markhelm) is de brug tussen de Utrechtse school
  en de IJssel/Twente-missie: met Lebuïnus predikte hij rond Deventer,
  Oldenzaal en Coevorden. Relieken rusten bij Lebuïnus in Deventer. Zo
  hoort hij bij de kerstening van het oosten van de noordelijke Lage
  Landen, ook al blijft zijn biografie fragmentarisch.
verhaal: |
  De Angelsaks Marcellinus kwam via Rome in contact met Gregorius van
  Utrecht en studeerde aan diens school. Hij predikte eerst onder de
  Friezen, daarna met Lebuïnus in Overijssel en Drenthe; Oldenzaal en
  Coevorden worden met hem verbonden. Later was hij custos van de
  Salvator te Utrecht. Hij stierf eind achtste eeuw (traditie: Oldenzaal);
  gebeente naar Deventer. Een aan hem toegeschreven Suitbertus-vita is
  een late vervalsing.
