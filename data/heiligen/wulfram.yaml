betekenis_lage_landen: |
  Wulfram predikte in Friesland na de Frankische herovering van het
  Utrechtse rivierengebied (na 695). Hij meldde zich bij Willibrord en
  werkte vooral rond Medemblik, aan het hof van Radboud. De bekende
  dooplegende — Radboud die afziet omdat hij zijn voorouders niet wil
  missen — en verhalen over redding van offerkinderen horen bij die
  Friese missie. Zo staat hij naast Willibrord in de kerstening van
  Friesland, ook al stierf hij te Fontenelle.
verhaal: |
  Wulfram (Wolfram) werd midden zevende eeuw geboren bij Fontainebleau
  (Milly-la-Forêt), monnik te Fontenelle, en was kort aartsbisschop van
  Sens (circa 692–695) voordat hij het ambt neerlegde. Vanuit Fontenelle
  ging hij met monniken naar Friesland: eerst Utrecht/Willibrord, dan
  dieper het Friese gebied in. Vitae (Jonas van Fontenelle e.a.)
  beschrijven doopsels, strijd tegen mensenoffers en Radbouds afwijzing
  van de doop. Hij keerde terug naar Fontenelle; sterfjaar 703 of later
  (soms 720). Relieken later te Abbeville (Saint-Vulfran).
over_bronnen: |
  Jaartallen en wonderverhalen lopen uiteen tussen vita en latere
  overlevering; de Friese missie naast Willibrord is de kerndraad die
  lexikon en Nederlandse naslag delen.
