selectie_toelichting: "Winter 678 prediking/doop in Friesland; hoofdzakelijk Engeland."
selectie_toelichting_publiek: |
  **Voor.** Op doorreis naar Rome (678/679) bleef Wilfrid maanden in
  Friesland. Volgens zijn vita doopte hij veel Friezen — dus handeling
  in huidig Nederland.

  **Twijfel.** Zijn levenswerk lag in Northumbrië/York. De Friese episode
  is kort; continentale bewijzen buiten de Engelse vita zijn schaars.
  Hij zocht de Friese missie later niet actief. Deur open als grensgeval.
