betekenis_lage_landen: |
  Wilfrid predikte en doopte in de winter van 678/679 in Friesland,
  gast van koning Aldgisl. Dat is een vroege Angelsaksische missie in
  huidig Nederland, vóór Willibrord. Zijn hoofdopdracht bleef Engeland.
verhaal: |
  Bisschop van York; in ballingschap op weg naar Rome landde hij in
  Friesland. Stephanus van Ripon beschrijft doop van edelen en volk.
  Later trok hij verder naar Rome. Willibrord groeide op te Ripon onder
  Wilfrids abdij, maar de Friese missie van 690 wordt vooral aan Egbert
  en Willibrord zelf toegeschreven.
over_bronnen: |
