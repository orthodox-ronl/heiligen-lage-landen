betekenis_lage_landen: |
  Als bisschop van Noyon-Doornik predikte Eligius onder Vlamingen,
  Morinen en Menapiërs en verder in Brabant/Antwerpen. Hij geldt als
  «apostel van Vlaanderen»: zijn bisdom en cultus (paardenzegeningen,
  smidsgilden) lopen dwars door Noord-Frankrijk en België. Zonder hem
  mist de vroegmiddeleeuwse kerk van Vlaanderen een kernfiguur.
verhaal: |
  Geboren te Chaptelat bij Limoges; goudsmid en muntmeester aan het
  hof van Chlotarius II en Dagobert I. Stichtte Solignac (632) en
  schonk veel aan armen en slaven. Na 639 priester; vanaf 641 bisschop
  van Noyon-Doornik. Vita door vriend Audoënus (Ouen). Overleden
  1 december 660 te Noyon. Patroon van smeden en metaalbewerkers;
  bekende legende van de afneembare paardenvoet.
