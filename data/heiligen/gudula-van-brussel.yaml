betekenis_lage_landen: |
  Goedele/Gudula is de stadsheilige van Brussel: haar relieken kwamen via
  Moorsel naar de burchtkapel en in 1047 naar de Michaelskerk, sindsdien
  Sint-Michiel en Sint-Goedele. Opvoeding in Nijvel (Gertrudis) en leven
  rond Moorsel/Hamme verbinden haar met de Pippiniden-kloostercultuur van
  Brabant.
verhaal: |
  Gudula (Goedele) werd omstreeks 650 geboren; de overlevering noemt
  Amalberga en Witger als ouders en Gertrudis van Nijvel als peettante.
  Zij leefde als boetelinge bij Moorsel/Hamme. Bekend is het
  lantaarnwonder: de duivel dooft haar licht, een engel steekt het weer
  aan. Zij stierf rond 712 (traditie: 8 januari). Reliekentranslaties
  (o.a. 979, 1047) vestigden de Brusselse cultus; een schedelreliek
  berust in Eibingen.
