betekenis_lage_landen: |
  Amor wordt verbonden met een kluis bij de Sint-Servaas te Maastricht
  (huidig Nederland) en met de abdijcultus van Munsterbilzen (Belgisch
  Limburg). Hij stierf volgens de overlevering te Maastricht; relieken
  gingen naar Munsterbilzen. Dat is handeling en cultus in de
  Maasstreek van de Lage Landen.
verhaal: |
  De Vita Sancti Amoris maakt hem tot Aquitaanse edelman die in Rome
  de opdracht kreeg zich bij Munsterbilzen te vestigen. Hij leefde als
  kluizenaar bij Maastricht en wordt (naast Landrada) met de abdij van
  Munsterbilzen verbonden. Overlijden te Maastricht; translatio van
  relieken naar Munsterbilzen (traditie 850). Feestdag 8 oktober.
over_bronnen: |
  Voldoet via Maastricht (NL) en Munsterbilzen (BE) ([1], [2]). Historische
  details dun; Landrada blijft de vroege stichteres van Munsterbilzen.
