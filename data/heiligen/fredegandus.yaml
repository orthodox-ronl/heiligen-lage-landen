selectie_toelichting: "Patroon van Deurne; abdij historisch onbewezen."
selectie_toelichting_publiek: |
  **Voor.** Deurne (bij Antwerpen) eert Fredegandus als eerste abt van
  een benedictijnenabdij in de zevende/achtste eeuw. De Vlaamse kalender
  zet hem op 17 juli.

  **Twijfel.** Hij wordt pas in de twaalfde eeuw genoemd (in een vita van
  Gummarus). Van de abdij Quortolodora zijn geen concrete sporen. De
  cultus is laat (reliek 1512, pest). Dat kan lokale toewijzing zijn
  zonder dat hij hier heeft gewerkt.
