betekenis_lage_landen: |
  Fredegandus is de patroon van Deurne. Of hij werkelijk abt was van
  een abdij die de Vikingen in 836 zouden hebben verwoest, is onbewezen.
verhaal: |
  Einde zevende eeuw abt te Deurne volgens de late traditie. Eerste
  schriftelijke vermelding twaalfde eeuw. Reliek in 1512 tegen de pest.
  De parochiekerk is sinds 1597 aan hem gewijd.
over_bronnen: |
  **Voor.** Plaats Deurne (België) en pre-schisma datering in de
  traditie ([1], [2], [3]).

  **Twijfel.** Wikipedia: nauwelijks iets bekend; abdij onbewezen; eerste
  vermelding 12e eeuw ([1]). Dat is te dun voor voldoet.
