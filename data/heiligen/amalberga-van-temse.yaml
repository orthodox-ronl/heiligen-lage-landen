betekenis_lage_landen: |
  Temse aan de Schelde eert haar als patrones (Wegom-bedevaart);
  relieken gingen naar de Sint-Pietersabdij te Gent. Vita en wonderen
  (steur, ganzen te Mater) verankeren haar stevig in Vlaanderen —
  onderscheiden van Amalberga van Susteren en van Maubeuge.
verhaal: |
  Opgevoed door tante Landrada te Munsterbilzen; weigerde volgens de
  legende een vorstelijk huwelijk (Karel). Rond 770 stichtte zij de
  Onze-Lieve-Vrouwekerk te Temse. Wonderverhalen: reuzenvis/steur op
  Schelde en Zenne, redding van akkers. Relieken later naar Gent.
  Vroege vita door Radboud van Utrecht; 11e-eeuwse bewerking door
  Goscelin.
