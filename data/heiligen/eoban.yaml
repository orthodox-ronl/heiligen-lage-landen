betekenis_lage_landen: |
  Eoban predikte met Bonifatius onder de Friezen en stierf op 5 juni
  754 bij Dokkum. Dat martelaarschap op Friese grond is hetzelfde keerpunt
  als bij Bonifatius zelf. Hij hoort bij de Gezellen van Bonifatius te
  Dokkum, maar heeft eigen merites: hulpbisschop van Utrecht en met name
  genoemde martelaar.
verhaal: |
  Eoban was een Angelsaksische benedictijn en priester. Hij
  evangeliseerde met Willibrord en Bonifatius in Friesland en werd
  waarschijnlijk door Bonifatius tot hulpbisschop van Utrecht benoemd. Op
  5 juni 754 werd hij bij Dokkum vermoord, samen met Bonifatius en de
  overige gezellen. Relieken van Eoban en Adolar kwamen later in Erfurt
  terecht.
over_bronnen: |
  Eoban voldoet: prediking in Friesland en martelaarschap te Dokkum
  (huidig Nederland) in 754, vóór het schisma ([1], [2], [3]). Hij maakt
  ook deel uit van de Gezellen van Bonifatius te Dokkum; die groep heeft
  een eigen pagina. Eigen merites: Utrechtse wijbisschop en met name
  genoemde martelaar ([1]).
