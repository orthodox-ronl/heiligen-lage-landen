betekenis_lage_landen: |
  Gerulfus is een van de oudste Vlaamse martelaren: een jongen uit
  Merendree die na zijn vormsel te Gent onderweg naar huis bij Drongen
  werd vermoord. Cultus in Drongen (Sint-Gerolfkerk).
verhaal: |
  Zoon van Lentgoldus en Ratguera te Merendree. Na het vormsel in de
  Sint-Pietersabdij te Gent werd hij door zijn peter vermoord. Hij
  vergaf de dader. Graf te Merendree, later cultus te Drongen. Feestdag
  25 september in Gent, 21 september elders.
over_bronnen: |
  Gerulfus voldoet: martelaarschap bij Drongen in huidig België,
  achtste eeuw ([1], [2], [3]). De vita is laat en legendarisch van toon;
  de lokale cultus en de plaats zijn de opnamegrond.
