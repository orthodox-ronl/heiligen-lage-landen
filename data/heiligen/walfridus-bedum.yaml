betekenis_lage_landen: |
  Walfridus is de heilige van Bedum in Groningen: volgens de
  plaatselijke overlevering een landbouwer (soms met zijn zoon Radfridus)
  die bij een Noormanneninval werd gedood. De middeleeuwse kerk van Bedum
  droeg zijn naam. De cultus is Gronings en lokaal.
verhaal: |
  De overlevering maakt van Walfridus een vrome leek te Bedum, vermoord
  door Vikingen, begraven waar later de Walfriduskerk stond. Jaartallen
  en details wisselen.
over_bronnen: |
  Een zelfstandige vroege vita is hier niet gevonden; Wikipedia en
  heiligen.net (Walfried van Bedum met Radfried) zijn de geraadpleegde
  bronnen. Heiligen.net viert hem op 3 december; deze kalender volgt de
  plaatselijke dag 22 juni.
