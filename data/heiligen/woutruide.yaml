betekenis_lage_landen: |
  Woutruide (Waudru/Waldetrudis) is de stadsheilige van Bergen: haar
  klooster op de heuvel Castrilocus werd de kern van Mons. Samen met
  zuster Aldegonda (Maubeuge) en echtgenoot Vincentius Madelgarius
  (Hautmont) hoort zij bij de Merovingische heiligenfamilie van
  Henegouwen — een wortel van het christendom in de zuidelijke Lage
  Landen. Ook Herentals eert haar als patrones.
verhaal: |
  Geboren te Cousolre (rond 612) als dochter van Waldebert en Bertilia,
  gehuwd met Vincentius Madelgarius; vier kinderen die als heiligen
  worden vereerd. Na wederzijdse kloosterkeuze stichtte zij een
  gemeenschap te Castrilocus (Mons) en werd eerste abdis. Zij stierf op
  9 april circa 688; heiligverklaring/cultus formeel in 1039. Relieken in
  de gotische collegiale Ste-Waudru; de Ducasse van Mons eert haar
  jaarlijks.
