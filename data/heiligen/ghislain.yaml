betekenis_lage_landen: |
  Ghislain leefde als kluizenaar bij Castrilocus (Mons) en stichtte
  een klooster te Ursidongus, nu Saint-Ghislain in Henegouwen (België).
  Hij gaf geestelijke raad aan Woutruide bij de stichting van Bergen.
verhaal: |
  Ghislain vestigde zich in de zevende eeuw in Henegouwen, eerst bij
  Castrilocus, later te Ursidongus. Aubertus van Kamerijk onderzocht en
  beschermde hem. Hij bewoog Vincentius Madelgarius en Woutruide tot het
  kloosterleven en stond in contact met Adelgonda van Maubeuge. Hij stierf
  omstreeks 680 in zijn klooster, dat zijn naam kreeg.
over_bronnen: |
  Ghislain voldoet: kluizenarij en kloosterstichting in Henegouwen;
  Saint-Ghislain is België, niet Frankrijk ([2], [3], [4]). Heiligen.net
  plaatst de plaats ten onrechte in Noord-Frankrijk ([1]); GCatholic en
  de encyclopedie van Henegouwen corrigeren dat ([3], [4]).
