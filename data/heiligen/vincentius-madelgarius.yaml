betekenis_lage_landen: |
  Vincentius (Madelgarius) stichtte de abdij van Zinnik/Soignies in
  huidig België en was de echtgenoot van Woutruide van Bergen. Hautmont
  ligt nu in Frankrijk; Zinnik is de Belgische stichting die hem in deze
  kalender plaatst.
verhaal: |
  Hoge beambte onder Dagobert, gehuwd met Woutruide; vier kinderen
  die als heiligen worden vereerd. Het paar koos het kloosterleven. Hij
  trad in te Hautmont (bij Maubeuge) onder de naam Vincentius en stond
  later aan de wieg van de abdij van Zinnik. Hij stierf omstreeks 677.
over_bronnen: |
  Vincentius voldoet vanwege de stichting van Zinnik in huidig België
  ([1], [2], [3]). Hautmont (nu Frankrijk) is dezelfde Merovingische
  familie als Woutruide en Adelgonda; de Belgische stichting weegt hier
  zwaarder dan de Franse. Woutruide heeft een eigen pagina.
