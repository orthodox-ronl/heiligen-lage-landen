betekenis_lage_landen: |
  Gaugericus bestuurde het bisdom Kamerijk, dat historisch tot de
  Nederlanden hoorde. De zetel ligt nu in Frankrijk.
verhaal: |
  Bisschop van Kamerijk in de late zesde en vroege zevende eeuw,
  gestorven 623 of 626. Feestdag 11 augustus.
over_bronnen: |
  **Voor.** Episcopaat Kamerijk, prediking in een bisdom dat Henegouwen
  raakte ([1], [2]).

  **Twijfel.** Zelfde geografische grens als Aubertus van Kamerijk
  (eigen pagina, nader onderzoek).
