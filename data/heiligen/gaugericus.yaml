selectie_toelichting: "Bisschop van Kamerijk; zetel nu in Frankrijk."
selectie_toelichting_publiek: |
  **Voor.** Gaugericus (Géry) was bisschop van Kamerijk (ca. 580–623)
  en predikte in een bisdom dat tot Henegouwen reikte. Vlaamse kalender
  11 augustus.

  **Twijfel.** Kamerijk ligt nu in Frankrijk. Dat is hetzelfde dossier
  als Aubertus van Kamerijk (al nader onderzoek): historisch de
  Nederlanden, huidige grens trekt de zetel weg.
