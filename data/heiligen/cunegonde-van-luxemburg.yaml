betekenis_lage_landen: |
  Cunegonde is in Luxemburg geboren en in Bamberg werkzaam geweest.
  Of geboorte in LU volstaat, is de open vraag.
verhaal: |
  Dochter van het Luxemburgse grafelijk huis, echtgenote van keizer
  Hendrik II, medestichteres van het bisdom Bamberg. Gestorven in 1040.
  Feestdag 3 maart.
over_bronnen: |
  **Voor.** Geboorte Luxemburg, † 1040, feestdag 3 maart ([1], [2]).

  **Twijfel.** Werk Bamberg (Duitsland). Het criterium eist iets gedaan
  in NL/BE/LU, niet alleen geboren zijn ([1]).
