selectie_toelichting: "Geboren in Luxemburg; werk in Bamberg."
selectie_toelichting_publiek: |
  **Voor.** Cunegonde werd in Luxemburg geboren (ca. 975) en stierf in
  1040, vóór het schisma. GCatholic zet haar bij Luxembourg. Feestdag
  3 maart.

  **Twijfel.** Haar werk (keizerin, stichting Bamberg) lag in het Duitse
  rijk, niet in de Lage Landen. Geboorte alleen is volgens de criteria
  niet genoeg — dezelfde lijn als Lioba (geboren elders, werk in
  Germanië, kandidaat-schrappen) maar omgekeerd: geboren hier, werk
  elders.
