betekenis_lage_landen: |
  Berlindis wordt vereerd te Meerbeke (Vlaanderen). De Vlaamse
  kalender zet haar op 3 februari; GCatholic geeft sterfjaar 940. In
  beide lezingen is het pre-schisma en in huidig België.
verhaal: |
  Berlindis, volgens de ene traditie zevende eeuw (nicht van Amandus),
  volgens GCatholic tiende eeuw, leefde als religieuze te Meerbeke. Haar
  grafkerk is de lokale cultusplaats.
over_bronnen: |
  Berlindis voldoet: leven en cultus te Meerbeke (België), vóór 1054
  ([1], [2], [3]). De datering (7e vs. 10e eeuw) verschilt per bron; beide
  vallen vóór het schisma.
