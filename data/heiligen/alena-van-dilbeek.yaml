betekenis_lage_landen: |
  Alena is een typisch Brabantse lokale heilige: Dilbeek, Vorst en de
  Affligemse elevatie van 1193 verbinden haar cultus vast aan Vlaams-
  Brabant. De vita is laat en legendarisch, maar de plaatselijke band
  met de Lage Landen is onbetwist.
verhaal: |
  Volgens de middeleeuwse legende (opgeschreven eeuwen later) was zij
  dochter van de heidense heer Levold. Zij liet zich dopen (traditie:
  door of in de tijd van Amandus) en bezocht heimelijk de kerk te Vorst.
  Dienaren van haar vader rukten haar arm af toen zij zich vastgreep;
  zij stierf. Haar vader bekeerde zich later. Elevatie van de relieken
  te Affligem in 1193. Modern onderzoek betwijfelt de authenticiteit van
  de Vorstse relieken. In Brabantse traditie komen ook 16, 18 en 24 juni
  voor; deze kalender houdt 17 juni aan.
over_bronnen: |
  Vita is 12e/13e-eeuws; geen contemporaine bron. Wel encyclopedie en
  heiligen.net.
