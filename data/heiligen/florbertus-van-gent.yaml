betekenis_lage_landen: |
  Florbertus was de eerste abt van de Sint-Pietersabdij op de
  Blandijnberg te Gent, door Amandus aangesteld. Hij is iemand anders dan
  Floribert van Luik.
verhaal: |
  Afkomstig uit de abdij van Elno (Saint-Amand-les-Eaux) werd
  Florbertus door Amandus naar Gent gehaald als eerste abt van de nieuwe
  Sint-Pietersabdij. Hij stierf omstreeks 661. Een heiligverklaring wordt
  in 1049 vermeld; feestdag 1 november.
over_bronnen: |
  Florbertus voldoet: abt van een Gentse abdij in de zevende eeuw
  ([1]). Niet te verwarren met Floribert van Luik, die een eigen pagina heeft.
