betekenis_lage_landen: |
  Plechelm (Plechelmus) hoort bij de Maas–Nederrijn-missie: met Wiro en
  Otger stichtte hij ca. 700 het klooster op de Sint-Petrusberg
  (Odiliënberg). Relieken gingen via Utrecht naar Oldenzaal (954), waar
  de Sint-Plechelmusbasiliek zijn hoofdcentrum werd. Zo verbindt hij
  Limburg met Twente binnen één Lage-Landen-cultus.
verhaal: |
  Plechelm kwam uit Northumbrië (of Ierland volgens latere traditie) en
  trok met Wiro en Otger naar het continent. Pepijn van Herstal schonk
  hun Berg bij Roermond; daar bouwden zij een klooster. Hij stierf op
  15 juli 732 (?). Bisschop Balderik verhief de relieken; in 954 gingen
  delen naar Oldenzaal. De vita is laat (tiende eeuw); koppeling aan
  Willibrord is secundair. Feestdag 15 juli; translatio 4 mei.
