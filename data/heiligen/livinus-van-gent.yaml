betekenis_lage_landen: |
  Livinus (Lieven) is in de Gentse traditie een Ierse missionaris
  die in Vlaanderen predikte en de marteldood stierf. De feestdag is
  dezelfde als die van Lebuinus van Deventer (12 november). De vraag is
  niet of Gent hem eert — dat doet het — maar of achter die cultus een
  zelfstandige historische persoon schuilgaat.
verhaal: |
  Volgens de Gentse *Passio* kwam Livinus uit Ierland, predikte hij
  in Vlaanderen, verbleef hij bij het graf van Bavo te Gent en werd hij
  onthoofd. Feestdag 12 november; lokale cultus onder meer te
  Sint-Lievens-Houtem.

  Die passio is laat (elfde eeuw, ten onrechte aan Bonifatius
  toegeschreven) en volgt in opbouw de oudere *Vita Lebuini* van
  Lebuinus van Deventer, die een eigen pagina heeft. De Gentse tekst
  voegt een Ierse jeugd, discipelen en een martelaarsdood toe die bij
  Lebuinus ontbreken.
over_bronnen: |
  **Voor.** Cultus en feestdag 12 november in Vlaanderen ([1], [2],
  [8]). De *Passio* plaatst prediking en martelaarschap in de Gentse
  streek ([3]).

  **Twijfel.** De *Vita Lebuini antiqua* (waarschijnlijk negende eeuw)
  is ouder dan de *Passio Livini* / BHL 4960 (elfde eeuw, vóór 1058)
  ([4], [3], [6]). Maurice Coens vroeg in 1952 of de auteur van de
  Passio de Vita Lebuini tot voorbeeld nam ([5]); repertoria
  formuleren sindsdien dat gegevens over Liafwin zijn gebruikt voor de
  biografie van de fictieve martelaar Livinus, apostel van Brabant
  ([6]). Parallelle episodes (Angelsaksische zending en een
  Gregorius/Augustinus-figuur; gastvrouw Abarhilda / Erapahildis;
  beschermer Folcbert / Florbertus; Davo / Bavo; zeereis; confrontatie
  met heidenen) maken toeval onwaarschijnlijk ([3], [4], [7]).

  Dat is geen bewijs dat de historische personen identiek waren. De
  Passio heeft veel eigen stof (Ierse afkomst, discipelen Foillanus,
  Elias en Kilianus, onthoofding) die in de Vita Lebuini ontbreekt
  ([3]). Lebuinus sterft als missionaris te Deventer, zonder
  martelaarschap ([4]). De namen Lebuinus/Livinus/Liafwin lopen in
  elkaar over en delen 12 november ([9], [10], [11]). Een recente
  samenvatting van de Koninklijke Commissie voor Geschiedenis herhaalt
  de klassieke positie: monniken van Sint-Baafs stelden een vita van
  Livinus samen naar het model van de Vita Lebuini en schreven die aan
  Bonifatius toe ([12]).

  Voorzichtige formulering: de Gentse Livinus is waarschijnlijk een
  elfde-eeuwse hagiografische constructie waarin de traditie van de
  historische Lebuinus is verwerkt. Of daarachter toch een zelfstandige
  persoon schuilgaat, is niet betrouwbaar vast te stellen. Daarom blijft
  deze fiche voorlopig staan, naast Lebuinus.
