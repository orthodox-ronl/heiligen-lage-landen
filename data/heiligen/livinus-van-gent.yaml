selectie_toelichting: "Gentse martelaarstraditie; waarschijnlijk hagiografische variant van Lebuinus."
selectie_toelichting_publiek: |
  **Voor.** De Vlaamse en Gentse kalender gedenken Lieven van Gent op
  12 november als Ierse bisschop-martelaar in Vlaanderen, met een eigen
  passio, cultus (onder meer Sint-Lievens-Houtem) en een plaats in
  GCatholic.

  **Twijfel.** De *Passio Livini* (elfde eeuw) is vrijwel zeker
  afhankelijk van de oudere *Vita Lebuini*. Livinus is daarmee
  waarschijnlijk een latere hagiografische variant of dubbelganger van
  Lebuinus van Deventer, niet een onafhankelijk overgeleverde
  historische figuur. Deze kalender houdt beide fiches voorlopig
  naast elkaar, tot een uitdrukkelijk besluit.
