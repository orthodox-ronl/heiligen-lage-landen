betekenis_lage_landen: |
  Adelgonda (Aldegonda) behoort tot de Merovingische heiligenfamilie van
  Henegouwen (ouders Walbertus en Bertilia; zuster Waltrudis). Maubeuge lag
  in historisch Henegouwen, nu in Frankrijk; relieken en patroonaten leven
  wel in Vlaanderen voort (onder meer Alken en As). Of dat genoeg is voor
  vaste selectie, vraagt nader onderzoek.
verhaal: |
  Om een opgelegd huwelijk te vermijden vluchtte zij en ontving volgens de
  overlevering de sluier van Amandus. Zij stichtte (of leidde) het klooster
  te Maubeuge aan de Samber en stierf er op 30 januari 684, traditioneel
  aan kanker. Wonderverhalen (Samber-oversteek, kaars, duif met sluier)
  horen bij de latere vitae. Cultus verspreidde zich in België, Noord-
  Frankrijk en langs de Rijn.
