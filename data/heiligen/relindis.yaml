samenvatting: |
  Tweede abdis van Aldeneik bij Maaseik; zuster van Herlindis.
  Feestdag 6 februari.
betekenis_lage_landen: |
  Relindis leidde Aldeneik na haar zuster Herlindis. Het klooster lag in
  het huidige Belgisch Limburg. De overlevering laat Bonifatius haar tot
  abdis wijden. Dat is bestuur van een klooster in de Lage Landen vóór
  het schisma.
verhaal: |
  Relindis (in het Heiligenlexikon Reinhild, ook Renula) was dochter van
  Adelard en Grinuara en zuster van Herlindis. Beide groeiden op in
  Valenciennes; hun ouders stichtten Aldeneik. Na de dood van Herlindis
  werd Relindis tweede abdis, naar de overlevering gewijd door Bonifatius.
  Sterfjaren lopen uiteen (onder meer circa 750 of 6 februari 780). Deze
  kalender volgt 6 februari als canonieke dag (Heiligenlexikon). De vita
  van de zusters is negende-eeuws.
