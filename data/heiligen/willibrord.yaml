betekenis_lage_landen: |
  Willibrord is de apostel van de Friezen en de stichter van de
  bisschopszetel Utrecht (695/696, met steun van Pepijn van Herstal en
  wijding door paus Sergius I). Vanuit Utrecht liep de kerstening van
  Holland, Friesland en de IJsselstreek; Echternach werd zijn
  grafklooster. Zonder hem is de vroege kerk van de noordelijke Lage
  Landen niet te vertellen. OrthodoxWiki eert hem als heilige van de
  ongedeelde Kerk.
verhaal: |
  Willibrord werd circa 658 in Northumbrië geboren, trad in te Ripon en
  verbleef twaalf jaar in Ierland (Rath Melsigi) voordat hij in 690 naar
  Friesland ging. In 695 wijdde paus Sergius I hem in Rome tot aartsbisschop
  van de Friezen. Hij stichtte kerken en kloosters, waaronder Utrecht en
  Echternach. Hij ontsliep op 7 november 739 te Echternach.
over_bronnen: |
  Alcuinus schreef zijn vita in de achtste eeuw. OrthodoxWiki volgt die
  hoofdlijn; details van individuele stichtingen (onder meer de exacte
  omvang van het Utrechtse territorium) blijven in de vakliteratuur in
  discussie.
