betekenis_lage_landen: |
  Poppo werd te Deinze geboren en was abt van Stavelot-Malmedy
  (België). Hij hervormde kloosters in Lotharingen. Hij stierf in 1048,
  vóór het schisma, te Marchiennes (nu Frankrijk); het werk in Stavelot
  is de opnamegrond.
verhaal: |
  Poppo (978–1048), uit Deinze, werd na een pelgrimstocht monnik en
  daarna abt van Stavelot-Malmedy. Hij voerde de Gorze-hervorming door in
  een reeks Lotharingse abdijen. Hij stierf op 25 januari 1048.
over_bronnen: |
  Poppo voldoet: geboren in Deinze, abt van Stavelot in huidig België,
  † 1048 ([1], [2], [3]). Sterfplaats Marchiennes is nu Frankrijk; dat
  doet niet af aan het abbatiaat te Stavelot.
