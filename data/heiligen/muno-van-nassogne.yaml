betekenis_lage_landen: |
  Muno (Monon) leefde als kluizenaar te Nassogne in de Belgische
  Ardennen en werd daar vermoord. Martelaarschap in huidig België.
verhaal: |
  Schotse of Ierse kluizenaar in de Ardennen, gedood omstreeks 645 te
  Nassogne. Plaatselijke cultus tot op heden.
