betekenis_lage_landen: |
  Gerebernus is de priester-metgezel van Dymphna. Volgens de vita
  vluchtte hij met haar naar de Kempen en werd hij bij Geel mee vermoord.
  Hij hoort bij hetzelfde martelaarschap als Dymphna, op dezelfde dag.
verhaal: |
  De late vita maakt Gerebernus tot de Ierse priester die Dymphna
  doopte en haar naar het vasteland volgde. Bij Geel werden beiden
  gedood. Zijn relieken gingen later naar Sonsbeck (Duitsland). Feestdag
  15 mei, dezelfde als Dymphna. Dymphna heeft een eigen pagina; Gerebernus
  staat hier op eigen merites als martelaar te Geel.
over_bronnen: |
  Gerebernus voldoet als martelaar te Geel (huidig België) in de
  traditie van de zevende eeuw ([1], [2]). De vita is laat (dertiende
  eeuw), dezelfde onzekerheid als bij Dymphna; de cultus te Geel is de
  vaste kern. Hij is geen louter groepsnaam: de bronnen noemen hem
  persoonlijk als priester en martelaar.
