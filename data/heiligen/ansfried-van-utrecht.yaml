betekenis_lage_landen: |
  Ansfried verbindt Lotharingse adel met het Utrechtse bisdom: graaf van
  Hoei, stichter van Thorn (met Hilsondis) en Hohorst bij Amersfoort, en
  bisschop te Utrecht tot zijn dood in 1010. Kernheilige van de
  middeleeuwse Utrechtse kerk in de Lage Landen.
verhaal: |
  Geboren te Leuven (~940); militaire en juridische vorming, graaf van
  Hoei. Met zijn vrouw Hilsondis (Herswindis; eigen pagina) stichtte hij
  de abdij van Thorn. Na haar dood werd hij in 995 onder Otto III
  bisschop van Utrecht. Hij stichtte Hohorst (Heiligenberg), leefde later
  half als monnik, werd blind en stierf op 3 mei 1010 te Hohorst; begraven
  in de Dom te Utrecht. Kroniek: Alpertus van Metz.
