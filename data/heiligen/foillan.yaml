betekenis_lage_landen: |
  Foillan werkte in het Pepijnse milieu te Nijvel (Gertrudis) en werd
  abt van het door haar gestichte klooster Fosses (Namen). Zijn
  martelaarschap bij Le Rœulx en cultus te Fosses-la-Ville maken hem
  tot een Ierse missieheilige van het Maas-Sambergegebied — kern van
  de zuidelijke Lage Landen.
verhaal: |
  Broer van Furseüs en Ultanus. Na East Anglia naar het continent;
  ontvangst door Clovis II; leraar te Nijvel. Gertrudis stelde hem
  ca. 652 tot abt van Fosses. Op 31 oktober 655/656 door rovers
  vermoord bij Le Rœulx. Cultus in Wallonië, Kamerijk en Aken
  (Sint-Foillankerk). Broer Ultanus volgde hem op te Fosses.
