betekenis_lage_landen: |
  Susteren (Limburg) bewaart haar graf in de romaans-basilicale
  Sint-Amelbergakerk, samen met andere Utrechtse/Limburgse heiligen.
  De abdij gaat terug op Willibrords schenking (714); Amalberga staat
  voor de vroegmiddeleeuwse kloostercultus in Nederlands Limburg.
verhaal: |
  Benedictines en eerste abdis na de herstichting van Susteren (traditie:
  onder koning Zwentibold; opvoeding van diens dochters Benedicta en
  Cecilia). Niet te verwarren met Amalberga van Temse of van Maubeuge.
  Relieken en cultus zijn sinds middeleeuwen aan de abdijkerk verbonden;
  zevenjaarlijkse heiligdomsvaart.
