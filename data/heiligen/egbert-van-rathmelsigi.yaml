betekenis_lage_landen: |
  Egbert bleef in Ierland, maar Rath Melsigi werd onder hem kweekschool
  voor de Friese missie. Hij zond Wigbert, later Willibrord en anderen.
  Titus Brandsma noemde die rol instrumenteel voor de kerstening van de
  Lage Landen. De band is reëel maar indirect.
verhaal: |
  Circa 639 in Northumbrië geboren; na ziekte te Rath Melsigi beloofde
  hij nooit naar Brittannië terug te keren. Hij wilde zelf naar de
  Friezen, maar storm en visioenen hielden hem tegen; Wigbert predikte
  twee jaar tevergeefs. Rond 690 zond hij Willibrord en gezellen. Later
  bracht hij te Iona de Romeinse paaspraktijk in. Overleden op Pasen
  729 te Iona.
