betekenis_lage_landen: |
  Odrada verbindt de Antwerpse Kempen (Balen/Scheps, Millegem) met
  Alem aan de Maas: kapittelcultus vanaf de elfde eeuw, vita 1304,
  relieken tot in Balen. Zij is een lokale heilige van beide zijden van
  de huidige grens — precies het type Lage-Landen-cultus van deze
  kalender.
verhaal: |
  De Vita Odrade (1304) tekent Odrada als adellijk meisje te Scheps bij
  Balen dat zich aan God wijdde. Bekend zijn het paardenwonder op weg
  naar de kerkwijding in Millegem en de begrafenis: ossen brachten haar
  lichaam naar Alem, waar een kerk verrezen. Zij stierf jong (traditie:
  achtste eeuw). Historische kern is dun; de cultus (Alem, Sint-Truiden,
  Balen) is wel degelijk. Feestdag 5 november (ook 3 november in Den
  Bosch).
