betekenis_lage_landen: |
  Hubertus is de schakel tussen Maastricht en Luik: hij droeg Lambertus’
  gebeente over en vestigde de bisschopstoel te Luik (ca. 717/718). Zijn
  missie in Brabant en de Ardennen verklaart de vele Hubertuskerken in
  Zuid-Nederland en België. De jachtlegende (hert met kruis) is laat
  (vanaf ca. 15e eeuw) en mag de historische bisschop niet vervangen.
verhaal: |
  Hubertus (ca. 655–727) was leerling van Lambertus van Maastricht. Na
  diens moord volgde hij hem op en verplaatste zetel en cultus naar
  Luik. Hij predikte in de Ardennen en Brabant en stierf op 30 mei 727
  (traditie: Tervuren). In 825 gingen relieken naar Andage (Saint-Hubert).
  De bekering tijdens de jacht is een middeleeuwse overdracht van de
  Eustachius-legende, niet een vroegbron.
