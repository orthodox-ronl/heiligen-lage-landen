betekenis_lage_landen: |
  Perpetuus wordt genoemd als bisschop van Maastricht (huidig
  Nederland). Hij koos volgens de overlevering Dinant (België) als
  residentie, stichtte er een Vincentiuskerk en werd daar begraven.
  Episcopaat Maastricht plus Maaslandse cultus: band met de Lage Landen
  vóór het schisma.
verhaal: |
  Bronnen zijn laat (o.a. Heriger van Lobbes, 10e eeuw); jaartallen
  wisselen (soms 6e eeuw). Heiligenlexikon: bisschop van Maastricht
  607/608, † 4 november 617 te Maastricht, begraven te Dinant. Patroon
  van Dinant; translatio 7 april. Biografie blijft dun.
over_bronnen: |
  Voldoet via Maastrichtse zetel ([1], [2]). Chronologie onzeker;
  zelfde dunne laag als andere vroege Maastrichtse bisschoppen.
