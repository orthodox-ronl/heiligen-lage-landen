betekenis_lage_landen: |
  Lebuinus (Liafwin) is de apostel van de IJsselstreek. Onder Gregorius
  van Utrecht zette hij na Bonifatius’ dood de missie voort, bouwde een
  kapel te Wilp en daarna de kerk te Deventer, waar heidense Saksen die
  kerk verbrandden en hij haar herbouwde. Ludger begroef hem daar. De
  Lebuïnuskerk blijft het stadsheiligtom van Deventer.
verhaal: |
  Lebuinus kwam uit Engeland (Ripon), ging omstreeks 754 naar het
  vasteland en werkte met Marchelm onder Gregorius van Utrecht. Rond 770
  stichtte hij de eerste kerk te Deventer. Het Heiligenlexikon noemt ook
  een (mislukte) prediking op de Saksische stamvergadering te Marklô; de
  vita uit Werden (circa 850) is daarvoor de bron en geldt in de
  vakliteratuur als belangrijk voor de Saksische instellingen.

  Hij stierf te Deventer omstreeks 773–780. Ludger vond later zijn
  relieken terug onder de herbouwde kerk. Livinus van Gent (zelfde
  feestdag) heeft een eigen pagina: de *Passio Livini* is waarschijnlijk
  een elfde-eeuwse hagiografische bewerking van deze vita, geen
  onafhankelijke historische dubbelganger. Deze kalender houdt Lebuinus
  aan als de historische missionaris. 16 november is een tweede lokale
  gedachtenis in de eerdere catalogus; het Heiligenlexikon noemt
  12 november als hoofddag en translaties in juni/juli.
