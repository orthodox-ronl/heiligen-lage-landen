betekenis_lage_landen: |
  Eucherius was bisschop van Orléans. Of zijn laatste jaren in de
  Lage Landen kerkelijk werk waren, is de open vraag.
verhaal: |
  Bisschop van Orléans, in conflict met Karel Martel, verbannen.
  GCatholic: dood in België, 743. Feestdag 20 februari.
over_bronnen: |
  **Voor.** GCatholic: death place Belgium, 743 ([2]). Vlaamse kalender
  ([1]).

  **Twijfel.** Titel en werk zijn Orléans. Ballingschap is geen
  prediking of stichting.
