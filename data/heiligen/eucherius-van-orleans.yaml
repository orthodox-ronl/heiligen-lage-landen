selectie_toelichting: "Bisschop van Orléans; band met de Lage Landen via ballingschap."
selectie_toelichting_publiek: |
  **Voor.** GCatholic laat hem in 743 in België sterven. De Vlaamse
  kalender zet hem op 20 februari. Sommige bronnen plaatsen zijn
  ballingschap in Hasnon of Sint-Truiden.

  **Twijfel.** Zijn episcopaat was Orléans (Frankrijk). Als hij hier
  alleen als verbannene stierf, is dat dunner dan «hier iets gedaan».
  Vergelijkbaar met pelgrims die hier sterven.
