betekenis_lage_landen: |
  Folciunus (Folquinus) bestuurde het bisdom Terwaan, dat tot in
  Vlaanderen reikte, en was nauw verbonden met de Sint-Bertinusabdij
  te Sint-Omaars. Hij stierf te Ekelsbeke (Frans-Vlaanderen). De zetel
  ligt nu in Frankrijk; de Vlaamse band blijft.
verhaal: |
  Omstreeks 817 tot bisschop van Terwaan gewijd. Hij herstelde
  relieken van Audomarus, nam deel aan synoden en gold als zorgzaam
  voor armen en pelgrims. Overleden 14 of 15 december 855 te
  Ekelsbeke; begraven te Sint-Bertinus. Elevatie 928. Vita door
  achterneef Folcuin van Lobbes.
