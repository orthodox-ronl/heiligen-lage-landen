betekenis_lage_landen: |
  Agricolaus staat op de traditionele Maastrichter bisschoppenlijst als
  opvolger van Servatius. De band met Maastricht is liturgisch en
  genealogisch; historisch is over hem niets met zekerheid bekend.
verhaal: |
  Middeleeuwse legenden laten hem kanunnik te Tongeren zijn, Servatius’
  grafkapel herstellen en na dertien jaar bisschopschap sterven op
  18 juli 401, begraven te Hoei. Heriger van Lobbes plaatste hem later
  (zesde eeuw); dat botst met de rest van de lijst. Feitelijk is hij een
  naam op een onzekere catalogus.
over_bronnen: |
  Geen zelfstandige Wikipedia-biografie; alleen lijsten en hagiografische
  samenvattingen.
