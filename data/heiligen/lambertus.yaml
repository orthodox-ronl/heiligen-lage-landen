betekenis_lage_landen: |
  Lambertus is de martelaarsbisschop van de Maaszetel. Hij volgde zijn
  oom Theodardus op, predikte onder de nog heidense Toxandren rond
  Tongeren, en werd circa 705 in zijn huis te Luik vermoord. Zijn
  opvolger Hubertus bracht de relieken naar Luik en verlegde de zetel
  daarheen. Maastricht en Luik danken hun middeleeuwse bisschopsstad aan
  deze keten.
verhaal: |
  Lambertus (Lantpert) werd omstreeks 635 geboren, neef van bisschop
  Theodardus van Maastricht. Na Theodards moord benoemde Childerik II hem
  tot opvolger (na 669). Na de moord op de koning leefde hij zeven jaar
  verbannen in Stavelot. Onder Pepijn van Herstal keerde hij terug en
  zette de missie in Toxandrië voort.

  Hij werd op 17 september circa 705 te Luik gedood, samen met verwanten.
  Het Heiligenlexikon noemt twee motieven in de overlevering: bloedwraak
  door Pippins huismeier Dodo, of — in latere vitae — terechtwijzing van
  Pippins overspel. De vroege vita (achtste eeuw) gaat aan die tweede
  lezing vooraf. Relieken gingen van Maastricht naar Luik (715); in de
  Franse Revolutie gingen de Luikse relieken verloren.
