betekenis_lage_landen: |
  Adela stichtte en bewoonde de abdij van Mesen (West-Vlaanderen) en werkte
  mee aan kapittels en abdijen in het graafschap. De band met de Lage Landen
  is geografisch en dynastisch duidelijk; haar dood (1079) en cultus
  vallen na 1054.
verhaal: |
  Dochter van Robert II van Frankrijk; huwde Boudewijn V van Vlaanderen.
  Zij steunde kerkhervorming en stichtingen (o.a. Mesen 1057, Ename 1063).
  Na Boudewijns dood (1067) ontving zij in Rome de sluier en trok zich terug
  in Mesen, waar zij in 1079 stierf en begraven werd. Cultus als zalige;
  gedenkteken in de crypte van Mesen.
over_bronnen: |
  Alleen encyclopedische/hagiografische pagina’s; geen pre-schisma
  orthodoxe vita of oosterse cultus.
