betekenis_lage_landen: |
  Walburga werkte in Germanië (Heidenheim/Eichstätt), niet in de Lage
  Landen. Wel is er middeleeuwse en latere cultus (onder meer Antwerpen,
  Oudenaarde, Veurne, Zutphen, Groningen, Netterden).
verhaal: |
  Walburga werd rond 710 in Wessex geboren, zus van Willibald en Winnibald
  (en, in de overlevering, nicht van Bonifatius). Opgeroepen voor de
  Duitse missie, leefde zij onder Lioba te Tauberbischofsheim en werd na
  Winnibalds dood abdis van Heidenheim (dubbelklooster). Zij stierf op
  25 februari 779. Relieken en «Walburgaolie» horen bij Eichstätt; de
  Walpurgisnacht (1 mei) herinnert aan de translatio van 870.
