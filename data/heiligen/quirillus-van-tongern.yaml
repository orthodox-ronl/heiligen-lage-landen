betekenis_lage_landen: |
  Quirillus hoort bij de middeleeuwse reeks «heilige bisschoppen» van
  Tongeren-Maastricht. Die lijst is grotendeels apocrief: na Servatius is
  er pas vanaf Falco enige zekerheid. Quirillus blijft dus een grensgeval —
  cultus en naam op de lokale lijst, geen harde vita — en vraagt nader
  onderzoek voordat hij als stevige LL-heilige telt.
verhaal: |
  Op de traditionele Maastrichtse bisschoppenlijst volgt Quirillus op
  Sulpitius (rond 480–520). Het Heiligenlexikon en heiligen.net vermelden
  sterfjaren rond 489 of 520; over zijn leven is verder niets bekend.
  Sommige historici opperen verwarring met Quirinus van Neuss (zelfde
  feestdag). Een late legende maakt hem zoon van een graaf van Namen en
  veertig jaar bisschop; dat is hagiografische vulling, geen bronbewijs.
