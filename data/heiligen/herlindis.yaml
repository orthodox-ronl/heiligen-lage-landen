samenvatting: |
  Eerste abdis van Aldeneik bij Maaseik. Feestdag 12 oktober.
betekenis_lage_landen: |
  Herlindis leidde het vrouwenklooster Aldeneik in het huidige Belgisch
  Limburg: prediking en kloosterleven aan de Maas, in de kring van
  Willibrord (die haar tot abdis wijdde) en later Bonifatius. Dat is werk
  in de Lage Landen vóór het schisma, geen latere cultus alleen.
verhaal: |
  Herlindis (ook Harlindis) werd omstreeks 695 geboren als dochter van de
  Frankische edelman Adelard en Grinuara. Zij groeide op in het
  benedictinessenklooster van Valenciennes. Rond 728–730 stichtten haar
  ouders Aldeneik bij Maaseik; Willibrord wijdde haar tot eerste abdis.
  Bronnen laten haar sterven tussen omstreeks 745 en 755 (vaak circa 750
  of 753). Haar zuster Relindis volgde haar op, naar de overlevering
  gewijd door Bonifatius. De vita is negende-eeuws (tussen 855 en 881);
  sterfjaren verschillen in de naslagwerken. Canoniek gedenkt deze
  kalender 12 oktober (sterfdag in het Heiligenlexikon).
