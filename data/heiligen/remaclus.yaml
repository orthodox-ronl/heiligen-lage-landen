betekenis_lage_landen: |
  Remaclus verbindt de Maasstreek met de Ardennen: als bisschop van
  Maastricht (na Amandus) en als stichter van Stavelot (en Malmedy)
  onder Sigibert III. Leerlingen als Theodardus, Trudo en Hadelinus
  zetten die lijn voort. Zijn cultus en schrijn in Stavelot horen bij de
  vroegmiddeleeuwse kerk van de zuidelijke Lage Landen.
verhaal: |
  Remaclus (Remakel) werd rond 600 in Aquitanië geboren, monnik te Luxeuil
  en eerste abt van Solignac (632). Rond 647/648 stichtte hij in de
  Ardennen Malmedy en Stavelot; kort daarna werd hij bisschop van
  Maastricht. Later legde hij het bisschopsambt neer om zich aan zijn
  stichtingen te wijden. Hij stierf te Stavelot (tussen circa 671 en 675);
  elevatie van relieken in 680. Het dertiende-eeuwse Remaclusschrijn staat
  in de Sint-Sebastiaanskerk te Stavelot.
