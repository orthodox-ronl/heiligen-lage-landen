betekenis_lage_landen: |
  Ultan hoort bij de Ierse kring rond Gertrudis van Nijvel: met Foillan
  kwam hij naar Fosses (Fosses-la-Ville), stichting op land van Itta en
  Gertrudis. Na Foillans dood werd Ultan abt. Zo verbindt hij de
  Angelsaksisch-Ierse missie met monastiek leven in het huidige Wallonië
  — dezelfde regio als Begga en Gertrudis.
verhaal: |
  Ultan, zoon van Fintan en Gelgès, was broer van Fursey en Foillan. Hij
  was monnik te Cnobheresburg (Burgh Castle) in Oost-Anglië, later
  kluizenaar met Fursey. Rond 651 vluchtten Foillan en Ultan voor Penda
  naar het vasteland; Gertrudis en Itta namen hen op. Foillan stichtte
  Fosses; na diens moord (655/656) volgde Ultan als abt. Hij werkte ook
  te Péronne; traditioneel sterft hij rond 686. Feestdag 1 mei (heiligen.net
  noemt ook 2 mei).
