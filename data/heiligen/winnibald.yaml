betekenis_lage_landen: |
  Winnibald (Wunibald) werkte onder Bonifatius in Thüringen, Beieren en
  Mainz en stichtte Heidenheim in het bisdom Eichstätt. Er is geen
  aantoonbaar missiewerk in de Lage Landen; de band loopt vooral via de
  Bonifatius-familie (Engeland/Germanië).
verhaal: |
  Geboren in 701 in Wessex als zoon van Richard en Wunna, pelgrimeerde
  Winnibald met vader en broer naar Rome (720), werd er monnik en keerde
  later terug. Bonifatius riep hem in 738 naar Germanië en wijdde hem tot
  priester. Hij werkte in Thüringen, het Beierse Frankenland en Mainz, en
  stichtte in 751/752 het klooster Heidenheim, waar hij abt was. Hij
  stierf op 18 december 761; zus Walburga leidde daarna het
  vrouwenklooster. Vita door Hugeburg van Heidenheim (eind achtste eeuw).
