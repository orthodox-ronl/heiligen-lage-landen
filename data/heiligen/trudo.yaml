betekenis_lage_landen: |
  Trudo is de naamgever van Sint-Truiden: op zijn landgoed Zerkingen
  (Haspengouw) bouwde hij kerk en klooster, gewijd onder Theodardus.
  Remaclus zond hem naar Metz voor opleiding; zo verbindt hij de
  Maastrichtse missielijn met een blijvende stedelijke en abdijcultus in
  Belgisch Limburg.
verhaal: |
  Trudo werd rond 628 in Haspengouw geboren uit Frankische adel. Remaclus
  stuurde hem naar Metz; Clodulf wijdde hem tot priester (655). Terug in
  zijn streek predikte hij en stichtte hij rond 657–660 een kerk en
  klooster aan de Cicindria — de kern van de latere abdij en stad
  Sint-Truiden. Hij stierf vermoedelijk op 23 november 693 en werd bij
  zijn kerk begraven. Vitae vanaf Donatus (achtste eeuw) schrijven
  wonderen toe, waaronder het kinderverhaal van het vernielde kerkje.
