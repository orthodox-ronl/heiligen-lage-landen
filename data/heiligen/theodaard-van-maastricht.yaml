betekenis_lage_landen: |
  Theodaard (Theodardus) staat in de Maaslijn tussen Remaclus en Lambertus:
  abt te Stavelot, daarna bisschop van Tongeren-Maastricht. Zijn martelaarschap
  (klacht over plundering van het bisdom) en de latere overbrenging van
  relieken naar Luik door Lambertus verankeren hem in de vroege kerk van
  de Maasstreek; Maastricht bewaart nog een moderne reliekhouder.
verhaal: |
  Volgens de overlevering uit Aquitanië, leerling van Remaclus te Solignac
  en abt van Stavelot-Malmedy, werd Theodaard bisschop van Maastricht na
  Remaclus’ afstand. Op weg naar koning Childerik II (klacht over
  onderdrukking door Frankische edelen) werd hij in het Bienwald bij Speyer
  vermoord (668/670). Lambertus liet hem naar Luik overbrengen. Hij wordt
  vaak afgebeeld met een zwaard door het hoofd; feestdag 10 september.
