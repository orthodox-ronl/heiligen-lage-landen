betekenis_lage_landen: |
  Willehad staat op de Groningse kalender als geloofsverkondiger.
  Het zwaartepunt van zijn werk lag in Saksen en Bremen.
verhaal: |
  Angelsaksisch missionaris, predikte onder Friezen en Saksen, werd
  eerste bisschop van Bremen, stierf in 789. Feestdag 8 november te
  Groningen, dezelfde dag als de Utrechtse bisschoppen.
over_bronnen: |
  **Voor.** Nederlandse bisdomkalender Groningen 8 november ([1]).
  Pre-schisma missionaris in de Friese wereld.

  **Twijfel.** Episcopaat Bremen; Friese prediking in huidig NL is niet
  eenduidig ([2]).
