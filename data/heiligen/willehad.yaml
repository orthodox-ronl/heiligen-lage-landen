selectie_toelichting: "Friese missie mogelijk; hoofdzakelijk Bremen/Saksen."
selectie_toelichting_publiek: |
  **Voor.** De Groningse bisdomkalender gedenkt Willehad op 8 november.
  Hij was Angelsaksisch missionaris in de Friese en Saksische wereld, in
  de kring van Willibrord en Bonifatius.

  **Twijfel.** Zijn bewezen episcopaat is Bremen. Of hij in huidig
  Nederland predikte (en niet alleen in het Duitse Friese/Saksische
  gebied), is niet hard. Vergelijk Swidbert (Kaiserswerth) die wél in
  Friesland met Willibrord werkte.
