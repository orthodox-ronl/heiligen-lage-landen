betekenis_lage_landen: |
  Willehad predikte vóór zijn Bremer episcopaat in het Friese en
  Groningse land: lang te Dokkum (waar Bonifatius was gevallen), daarna
  over de Lauwers in Humsterland, en met vrucht in Drenthe. Dat werk in
  huidig Nederland — niet alleen later Bremen — maakt hem tot heilige
  van de Lage Landen. De Groningse kalender gedenkt hem op 8 november.
verhaal: |
  Willehad kwam uit Northumbrië, werd priester en trok omstreeks 772 naar
  Friesland. Bij Dockynchirica (Dokkum) werkte hij lange tijd onder de
  Friezen. Over de Lauwers predikte hij in Humarcha (Humsterland); daar
  ontsnapte hij ternauwernood aan de dood. In Thrianta (Drenthe) doopte
  hij velen, tot heidense tegenstand hem opnieuw in gevaar bracht.

  Karel de Grote zond hem later naar de Saksen in Wigmodië. Na de
  opstand van Widukind (782) vluchtte hij via Rome naar Echternach. In
  787 werd hij bisschop; hij vestigde zijn zetel te Bremen, wijdde daar
  op Allerheiligen 789 een Petruskerk, en stierf een week later (8
  november) te Blexen aan de Wezer.
over_bronnen: |
  De Vita Willehadi (Ansgar-kring / Bremen) noemt Dokkum, Humarcha en
  Thrianta expliciet vóór het Saksische episcopaat ([1], [2], [3]).
  Identificatie Humarcha ≈ Humsterland en Thrianta ≈ Drenthe is
  gangbaar in lexikon en vakliteratuur. Episcopaat Bremen is zeker; dat
  heft de Friese prediking in huidig NL niet op.
