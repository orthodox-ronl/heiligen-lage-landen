betekenis_lage_landen: |
  Frederik was bisschop van Utrecht in de Karolingische tijd (ca.
  815–838). Hij predikte onder meer op Walcheren en, met Odulphus,
  in het noorden. Zijn martelaarslegende en graf in de Salvatorkerk
  maken hem tot een vaste Utrechtse heilige van vóór het schisma —
  kern van de noordelijke Lage Landen.
verhaal: |
  Uit Friese adel; opgeleid te Utrecht onder Ricfried. Als bisschop
  bekend om geleerdheid (band met Hrabanus Maurus; synode Mainz 829).
  De Passio Friderici (11e eeuw) vertelt moord na de mis, toegeschreven
  aan keizerin Judith of aan tegenstanders van de kerstening op
  Walcheren — historisch omstreden. Overleden ca. 18 juli 834–838;
  begraven in de Salvatorkerk. Patroon tegen doofheid.
