selectie_toelichting: "Bisschop van Terwaan; Sint-Omaars nu in Frankrijk."
selectie_toelichting_publiek: |
  **Voor.** Audomarus (Omaar) was bisschop van Terwaan en stichtte het
  klooster Sithiu (Sint-Omaars). Het historische bisdom reikte tot
  Vlaanderen. Vlaamse kalender 9 september.

  **Twijfel.** Terwaan en Sint-Omaars liggen nu in Frankrijk. Zelfde
  dossier als Folciunus van Terwaan (al nader onderzoek).
