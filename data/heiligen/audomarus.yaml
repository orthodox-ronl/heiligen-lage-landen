  Frankrijk; historisch raakte het Vlaanderen.
verhaal: |
  Leerling van Eustachius van Luxeuil, bisschop van Terwaan, stichter
  van Sithiu. Gestorven in 670. Feestdag 9 september.
over_bronnen: |
  **Voor.** Missiebisschop van een bisdom dat tot de historische
  Nederlanden hoorde ([1], [2]).

