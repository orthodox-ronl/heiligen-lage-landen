betekenis_lage_landen: |
  Medardus’ zetel Noyon ligt in Picardië, maar hij werd ook bisschop van
  Doornik en wordt verbonden met missie onder de Vlamingen. Zijn cultus
  trok vroeg naar Vlaanderen en het Rijnland.
verhaal: |
  Medardus, geboren te Salency, werd ca. 531 bisschop van Vermand en
  verplaatste de zetel naar Noyon. Kort daarna kreeg hij ook Doornik.
  Hij gold als raadsman van Chlotarius I; zijn lichaam kwam naar Soissons
  (Saint-Médard). De vita (toegeschreven aan Venantius Fortunatus) en
  volkswijsheid (weer op 8 juni) versterkten zijn populariteit. Relieken
  en patronaten (boeren, wijn) leven tot in Duitsland en Nederland
  (o.a. Wessem).
