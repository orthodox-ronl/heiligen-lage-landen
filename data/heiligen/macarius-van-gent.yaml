betekenis_lage_landen: |
  Macarius stierf te Gent in 1012. De vraag is of sterven in een
  Gentse abdij telt als «hier iets gedaan».
verhaal: |
  Pelgrim die in de Sint-Baafsabdij of Sint-Pietersabdij te Gent
  werd opgenomen en daar in 1012 stierf. Feestdag 10 april.
over_bronnen: |
  **Voor.** Dood en cultus te Gent, 1012, vóór het schisma ([1], [2]).

  **Twijfel.** GCatholic noemt hem layperson; de bronnen maken hem tot
  pelgrim, niet tot prediker of stichter ([2]). Dat lijkt op cultus zonder
  eigen werk.
