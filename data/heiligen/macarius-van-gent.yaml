selectie_toelichting: "Pelgrim, gestorven te Gent; weinig eigen werk aantoonbaar."
selectie_toelichting_publiek: |
  **Voor.** Macarius stierf in 1012 te Gent en wordt daar als heilige
  vereerd (10 april). Hij was in de Lage Landen en de Gentse abdij nam
  hem op.

  **Twijfel.** Hij was pelgrim (in de traditie uit Armenië of Antiochië)
  die in Gent aankwam en er stierf. «Alleen gestorven» of late cultus is
  volgens de criteria niet genoeg: hij moet hier iets hebben gedaan.
  Prediking of bestuur is niet hard te maken.
