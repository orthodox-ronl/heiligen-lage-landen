betekenis_lage_landen: |
  Piatus is de traditionele apostel en martelaar van Doornik (Tournai)
  in huidig België. De cultus is oud (o.a. herontdekking door Eligius);
  prediking en martelaarschap horen bij de vroegste kerstening van de
  zuidelijke Lage Landen, vóór het schisma.
verhaal: |
  Volgens de late Passio kwam Piatus uit Italië (Benevento) en predikte
  hij in de streek van Doornik en Rijsel. Onder Maximianus zou hij zijn
  gemarteld (scalpering). Details zijn legendarisch; de vaste kern is
  de Doornikse cultus en feestdag 1 oktober. Relieken werden later o.a.
  naar Chartres gebracht.
over_bronnen: |
  Opname: prediking/martelaarschap verbonden met Doornik in huidig
  België ([1], [2]). Vita laat en deels legendarisch — zelfde klasse
  als andere vroeg-Gallische martelaarstradities.
