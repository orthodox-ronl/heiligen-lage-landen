betekenis_lage_landen: |
  Wolbodo was bisschop van Luik (1018–1021). Dat is kerkbestuur in
  huidig België, vlak vóór het schisma.
verhaal: |
  Wolbodo, eerst kanunnik en scholaster, werd in 1018 bisschop van
  Luik en stierf op 21 april 1021. Hij wordt lokaal als heilige vereerd.
