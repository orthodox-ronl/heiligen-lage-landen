betekenis_lage_landen: |
  Reinildis van Saintes is in de traditie een zuster van Gudula en
  martelares te Saintes (België). Zij is iemand anders dan Relindis van
  Aldeneik.
verhaal: |
  Volgens de Brabantse familiestamboom (Witger, Amalberga, Gudula)
  leefde Reinildis als kluizenares en werd zij te Saintes vermoord.
  Feestdag 16 juli.
over_bronnen: |
  Reinildis voldoet als martelares te Saintes in huidig België ([1]).
  Niet te verwarren met Relindis van Aldeneik (eigen pagina).
