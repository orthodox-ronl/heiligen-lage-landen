betekenis_lage_landen: |
  Guibertus stichtte de abdij van Gembloers (Gembloux) in huidig
  België. Dat is kloosterstichting vóór het schisma.
verhaal: |
  Guibertus, Lotharingse edelman, stichtte midden tiende eeuw de
  abdij van Gembloers. Hij stierf in 962.
over_bronnen: |
  Guibertus voldoet: stichting van Gembloers in België, † 962
  ([1], [2]). GCatholic zet de dood in Frankrijk; de abdij zelf ligt in
  België ([2]).
