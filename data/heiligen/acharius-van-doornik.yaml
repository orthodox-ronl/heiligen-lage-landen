betekenis_lage_landen: |
  Acharius bestuurde Doornik (Tournai) en Noyon en steunde Amandus’ werk in
  het Belgische Merovingische rijk. Via hem kwam ook het bisdom Terwaan tot
  stand, met Omaars als eerste bisschop. Zo hoort hij bij de vroegste
  bisschoppelijke organisatie van de zuidelijke Lage Landen.
verhaal: |
  Acharius kwam uit de school van Columbanus en was monnik te Luxeuil onder
  Eustasius. Rond 621–627 werd hij bisschop van Noyon-Doornik. Hij had aanzien
  bij koning Dagobert I, steunde Amandus (maar kon diens verbanning niet
  verhinderen) en verkrijgde in 636 de oprichting van het bisdom Terwaan.
  Hij stierf omstreeks 27 november 639; Eligius volgde hem op. Cultus volgde
  spoedig na zijn dood.
