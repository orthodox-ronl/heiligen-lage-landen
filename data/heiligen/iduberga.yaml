samenvatting: |
  Echtgenote van Pepijn van Landen; stichtte de abdij van Nijvel.
  Feestdag 8 mei.
betekenis_lage_landen: |
  Iduberga (Itta) legde met Nijvel (ca. 640/649, raad van Amandus) het
  huis-klooster van de Pippiniden. Haar dochters Gertrudis (Nijvel) en
  Begga (Andenne) zetten die lijn voort; Fosses-la-Ville diende Ierse
  missiebroeders. Zonder haar is de Brabantse kloostergeschiedenis van
  de zevende eeuw niet te vertellen.
verhaal: |
  Iduberga trouwde met Pepijn van Landen; kinderen waren onder meer
  Grimoald, Begga en Gertrudis. Na Pepijns dood (640) stichtte zij Nijvel
  en leefde er als non; zij liet boeken en relieken uit Rome en «van
  overzee» komen. Ook Fosses (Ierse monniken Foillan/Ultan) wordt haar
  toegeschreven. Zij stierf op 8 mei 652; Gertrudis leidde Nijvel verder.
  Bavo als zoon/dochter van Iduberga is een gangbare catalogustraditie,
  genealogisch niet onomstreden.
