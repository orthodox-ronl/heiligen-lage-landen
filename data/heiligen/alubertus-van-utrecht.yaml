betekenis_lage_landen: |
  Alubertus vulde als gewijde bisschop de leemte op toen Gregorius Utrecht
  als priester-abt bestuurde. Hij kwam uit Northumbria, werkte in
  Friesland en nam Ludger mee naar York voor diens diakenwijding — een
  schakel in de Utrechtse/Friese missie van de Lage Landen.
verhaal: |
  Volgens Altfrids Ludger-vita kwam Alubertus uit Engeland om Gregorius te
  helpen. Hij wilde in eigen land gewijd worden; te York ontving hij de
  bisschopswijding (767) en Ludger werd er diaken. Terug in Friesland bleef
  hij bij Gregorius. Sterfjaar en -dag zijn onbekend; men neemt aan vóór
  Gregorius († ca. 775). Feestdag 25 augustus (vooravond van Gregorius).
