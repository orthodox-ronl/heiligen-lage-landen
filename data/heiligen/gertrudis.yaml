betekenis_lage_landen: |
  Gertrudis maakte Nijvel tot het huis-klooster van de Pippiniden: onderwijs
  voor meisjes, boeken uit Rome, banden met het columbaanse monnikendom.
  Haar moeder Iduberga stichtte Nijvel; Gertrudis leidde het na 652. Uit
  Nijvel gingen nonnen naar Andenne (Begga). De vita van circa 680 is vroeg
  genoeg om haar als historische abdis van Brabant te lezen, niet als late
  legende.
verhaal: |
  Gertrudis werd 625/626 geboren als dochter van Pepijn van Landen en
  Iduberga. Het Heiligenlexikon merkt op dat geen vroege bron haar
  uitdrukkelijk «abdis» noemt, wel leidster van Nijvel na de dood van haar
  moeder (652). Zij stierf op 17 maart 659 (of 653). Ierse monniken in
  Nijvel zouden die sterfdag — dezelfde als Patrick — hebben voorspeld.

  Het Heiligenlexikon noemt Bavo van Gent als broer; die koppeling is in
  overzichten gangbaar maar genealogisch niet onomstreden. De feestdag in
  deze kalender volgt 17 maart (Heiligenlexikon, algemene traditie); 12
  februari stond eerder als hoofddag in de catalogus zonder hier gevonden
  bron.
