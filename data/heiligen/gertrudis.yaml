betekenis_lage_landen: |
  Gertrudis maakte Nijvel tot het huis-klooster van de Pippiniden: onderwijs
  voor meisjes, boeken uit Rome, banden met het columbaanse monnikendom.
  Haar moeder Iduberga stichtte Nijvel; Gertrudis leidde het na 652. Uit
  Nijvel gingen nonnen naar Andenne (Begga). De vita van circa 680 is vroeg
  genoeg om haar als historische abdis van Brabant te lezen, niet als late
  legende.
verhaal: |
  Gertrudis werd 625/626 geboren als dochter van Pepijn van Landen en
  Iduberga. Na de dood van haar moeder (652) leidde zij Nijvel. Zij
  stierf op 17 maart 659 (of 653). Ierse monniken in Nijvel zouden die
  sterfdag — dezelfde als Patrick — hebben voorspeld. Soms wordt Bavo
  van Gent als haar broer genoemd.
over_bronnen: |
  Vroege bronnen noemen haar niet uitdrukkelijk «abdis», wel leidster van
  Nijvel. De koppeling aan Bavo is in overzichten gangbaar maar
  genealogisch omstreden. Canoniek is 17 maart (Heiligenlexikon); 12
  februari stond eerder als hoofddag in onze catalogus zonder hier
  gevonden bron.
