betekenis_lage_landen: |
  Op 5 juni 754 werden bij Dokkum, tijdens een vormseltocht onder de
  Friezen, Bonifatius en zijn gevolg vermoord. Die gezellen zijn heilig
  als martelaren van die dag op Friese grond. Twee van hen hebben ook een
  eigen pagina: Bonifatius (leider van de missie) en Eoban (hulpbisschop
  van Utrecht). De overige namen (onder meer Adolar, Bosa, Elleher,
  Gundekar, Hamund, Hathawulf, Scirebald, Waccar, Walter, Wintrung) zijn
  bekend als leden van deze groep.
verhaal: |
  Bonifatius keerde tegen het einde van zijn leven naar Friesland
  terug. Bij Dokkum werd hij met tientallen metgezellen gedood. GCatholic
  noemt naast Eoban onder meer Adolar von Erfurt, Bosa, Elleher, Gundekar,
  Hamund, Hathawulf, Scirebald, Waccar, Walter en Wintrung, allen
  gestorven in 754 in de Nederlanden. Relieken van Bonifatius gingen naar
  Fulda; die van Eoban en Adolar later naar Erfurt.

  Zelfstandig in deze kalender: Bonifatius en Eoban. Deze pagina is de
  groepsgedachtenis van de overige martelaren.
over_bronnen: |
  De groep voldoet als martelaren in huidig Nederland in 754 ([2], [3]).
  Bonifatius en Eoban hebben eigen merites (missieleiding respectievelijk
  Utrechts episcopaat) en dus een eigen heiligenpagina ([1], [4]). De
  overige namen zijn heilig vanwege lidmaatschap van deze martelaarsgroep
  ([2]).
