betekenis_lage_landen: |
  Beregisus stichtte het klooster Andage in de Ardennen, later
  Saint-Hubert (België). Dat is kloosterstichting in de zevende/achtste
  eeuw.
verhaal: |
  Beregisus, volgens de traditie aartsdiaken van de palts, stichtte
  Andage. Het klooster werd later het centrum van de Hubertuscultus
  (Saint-Hubert).
over_bronnen: |
  Beregisus voldoet: stichting van Andage/Saint-Hubert in België
  ([1], [2]).
