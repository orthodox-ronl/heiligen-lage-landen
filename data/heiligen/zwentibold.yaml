betekenis_lage_landen: |
  Zwentibold was de laatste koning van Lotharingen en ligt te
  Susteren. De lokale Kerk eerde hem als martelaar. Of dat genoeg is
  voor deze kalender, is nog open.
verhaal: |
  Onechte zoon van Arnulf van Karinthië, in 895 koning van
  Lotharingen. Hij verleende Tiel tolrechten (896) en steunde de kerk na
  de Noormanneninvallen. Op 13 augustus 900 werd hij nabij de Maas
  gedood. Graf en relieken te Susteren. Amalberga van Susteren heeft een
  eigen pagina.
over_bronnen: |
  **Voor.** Verblijf en dood in de Maasvallei, kerkelijke schenkingen,
  graf Susteren, middeleeuwse heiligenverering ([1], [2]).

  **Twijfel.** Wikipedia tekent hem als vorst; de heiligheid is lokale
  martelaarscultus, mogelijk meer symbool dan vita ([1]). Heiligen.net
  heeft een feestdagpagina ([2]), geen rijke kerkelijke vita.
