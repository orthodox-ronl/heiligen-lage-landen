selectie_toelichting: "Koning van Lotharingen; lokale martelaarscultus te Susteren."
selectie_toelichting_publiek: |
  **Voor.** Zwentibold regeerde Lotharingen (895–900), verleende
  handelsrechten aan Tiel, Deventer en Utrecht, bevorderde kerken en
  kloosters, en werd in 900 bij de Maas gedood. Hij ligt te Susteren;
  middeleeuwse martelaarscultus. Dochters Benedicta en Cecilia werden
  abdissen van Susteren. Amalberga van Susteren (eigen pagina) voedde
  hen op.

  **Twijfel.** De bronnen tekenen hem vooral als vorst, niet als
  prediker of abt. De cultus is lokaal en deels politiek (Lotharings
  zelfbewustzijn). Of «koning + graf + cultus» gelijkstaat aan «hier
  iets gedaan» in kerkelijke zin, is dezelfde vraag als bij andere
  vorstelijke figuren.
