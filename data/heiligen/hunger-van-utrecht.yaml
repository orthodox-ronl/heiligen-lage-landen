betekenis_lage_landen: |
  Hunger (Hungerus Frisus) stond de Utrechtse kerk voor in een crisis:
  Vikingen bedreigden Dorestad/Utrecht; de clerus week uit naar
  Sint-Odiliënberg (858) en later Prüm en Deventer. Als bisschop uit
  Friesland belichaamt hij de Friese–Utrechtse band in de negende eeuw.
  Zijn standpunt in de huwelijkszaak van Lotharius II toont moreel
  gezag naast de vluchtgeschiedenis.
verhaal: |
  Hunger werd rond 800 in Friesland geboren en was kanunnik te Utrecht
  toen hij ca. 854 bisschop werd (Craft weigerde vanwege de Noormannen).
  Eerst was er vrede met Rorik van Dorestad; later vluchtte de clerus naar
  Odiliënberg. Hij keerde tijdelijk terug, verbleef ook in Prüm en
  Deventer, en stierf op 22 december 866 (traditie: Prüm). Paus Nicolaas I
  prees zijn verzet tegen de echtscheiding van Lotharius II.
