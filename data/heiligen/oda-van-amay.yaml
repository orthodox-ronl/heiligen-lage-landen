betekenis_lage_landen: |
  Oda/Chrodoara is de stichtster-heilige van Amay (Maasland, bij Hoei):
  de sarcofaaginscriptie noemt haar edelvrouw die uit eigen middelen
  heiligdommen stichtte. Dat maakt haar een concrete Merovingische
  heilige van het Luikse Maasdal, niet een late Brabantse legende.
verhaal: |
  Chrodoara (later Oda genoemd) leefde als Frankische edelvrouw en werd
  vóór 634 in de Sint-Joriskerk van Amay begraven (testament van neef
  Adalgisel Grimo). In 1977 vond men onder het koor haar Merovingische
  sarcofaag met opschrift Sancta Chrodoara. Of zij abdis was, blijft
  onzeker (staf op het deksel). Elevatio door bisschop Floribertus
  bekrachtigde de cultus. Het Heiligenlexikon verwart Amay soms met
  Hamage bij Douai; de Amay-sarcofaag bij Hoei is leidend.
over_bronnen: |
  Prefereren: NL-Wikipedia en de Amay-sarcofaagdocumentatie. Lexikon
  gebruiken voor feestdag/naam, niet voor de Hamage-localisatie.
