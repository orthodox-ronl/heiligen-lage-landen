samenvatting: |
  Nafeest tot en met de [teruggave](/feesten/teruggave-geboorte-moeder-gods/) op 12 september.
verhaal: |
  Na 8 september blijft de Geboorte van de Moeder Gods liturgisch aanwezig tot de [teruggave](/feesten/teruggave-geboorte-moeder-gods/) op 12 september. Deze kalender toont die periode als één nafeest.
