samenvatting: |
  Nafeest tot en met de [teruggave](/feesten/teruggave-ontmoeting-in-de-tempel/) op 9 februari (volle jaarcyclus).
verhaal: |
  Na 2 februari blijft de Ontmoeting liturgisch aanwezig tot de [teruggave](/feesten/teruggave-ontmoeting-in-de-tempel/) op 9 februari. Valt het feest in de Boterweek of de Grote Vasten, dan bekort het typikon dit nafeest; deze kalender toont de volle jaarcyclus-periode.
