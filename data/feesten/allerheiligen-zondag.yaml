samenvatting: |
  Eerste zondag na Pinksteren; alle heiligen.
verhaal: |
  De eerste zondag na Pinksteren gedenkt alle heiligen, bekend en onbekend.
  De zondag daarna is in de Slavische traditie de gedachtenis van de
  heiligen van de lokale Kerk; op deze site de
  [Zondag van de heiligen van de Lage Landen](/feesten/zondag-heiligen-lage-landen/).
betekenis: |
  Pinksteren draagt vrucht: mensen in wie de Geest woont. Deze zondag
  zet niet een paar namen apart, maar de hele oogst — tot wie niemand
  op aarde herdacht. Dat is de Kerk: heiligheid is mogelijk, hier.

  Wie tot de heiligen wordt gerekend, is geroepen dezelfde weg te gaan.
  Vanaf de maandag erna begint in veel kerken het Apostolisch vasten,
  tot Petrus en Paulus — niet op de Pinkstermaandag zelf.
