id: zondag-myrondraagsters
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Zondag van de myrondraagsters
  alternatief:
  - Myrondraagsterszondag
  - Zondag van de myrrhedraagsters
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 14
samenvatting: |
  De vrouwen bij het graf; Jozef van Arimatea en Nicodemus.
verhaal: |
  De vrouwen gaan met myron (mirre) naar het graf; Jozef en Nicodemus begroeven
  Hem.
betekenis: |
  Zij komen te laat voor de dood en op tijd voor het leven. De Opstanding
  wordt eerst aan hen gezegd: ga, vertel. Trouw na het kruis — niet de
  twaalf die vluchtten — opent het graf.

  Breng wat je hebt: myron (mirre), een doek, een naam. De Kerk eert wie bij het
  lichaam bleef toen het donker was.
