samenvatting: |
  Tweede zondag na Pinksteren: de heiligen van de lokale Kerk; op deze
  site de heiligen van de Lage Landen.
verhaal: |
  De eerste zondag na Pinksteren is Allerheiligen: de hele wolk van
  getuigen. In de Slavische traditie volgt daarop, de zondag erna, de
  gedachtenis van de heiligen van de *lokale* Kerk — in Rusland de
  heiligen van het Russische land, elders de heiligen van die Kerk.

  Deze kalender vult die plaats in met de heiligen van de Lage Landen:
  niet als synodaal menaion van een autocefale kerk, maar als dezelfde
  beweging van universeel naar hier. Hun eigen gedenkdagen blijven op
  hun feestdatum. Deze zondag zet ze als koor bijeen. Wie in de lijst
  hoort, staat in het
  [overzicht van heiligen van de Lage Landen](/heiligen/).
betekenis: |
  Pinksteren maakt heiligen, niet alleen in de verte. De lokale Kerk is
  geen bijlage bij de universele: dezelfde Geest woont in deze grond,
  deze talen, deze namen.

  Gedenk wie hier predikte, stierf of de Orthodoxie opbouwde. Lees hun
  namen; vraag hun gebed; ga hun weg op de plaats waar u staat.
