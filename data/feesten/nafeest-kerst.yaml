samenvatting: |
  Nafeest van Kerst tot en met de [teruggave](/feesten/teruggave-kerst/) op 31 december.
verhaal: |
  Na 25 december blijft Kerst liturgisch aanwezig tot de [teruggave](/feesten/teruggave-kerst/) op 31 december. 26 december is tegelijk de synaxis van de Moeder Gods. 1 januari is de Besnijdenis; daarna begint het voorfeest van Theofanie.
