    rol: typikon
    opmerking: >
      Over de versoepelingen het hele jaar: Aankondiging tot Palmzondag vis;
      in de Grote Week olie en wijn; weekschema voor Apostelen- en Geboortevasten;
      in het Ontslapen-vasten vis alleen op de Transfiguratie; Kruisverheffing
      en Onthoofding zonder vis.
  - label: "Typikon hoofdstuk 49, Lazarus-zaterdag (citaat via SPŽ)"
    url: "https://spzh.eu/ru/socseti/79300-lazareva-subbota-pogovorim-ob-ikre-i-ne-tolyko"
