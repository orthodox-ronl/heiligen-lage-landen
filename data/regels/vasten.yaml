titel: Vasten
beschrijving: Waar onze vastenregels vandaan komen, en wat de kalender op een dag toont
inleiding: |
  Orthodox vasten is een manier van eten en bidden die de Kerk het jaar door
  voorschrijft: geen vlees, vaak ook geen zuivel, vis, wijn of olie. Wat
  precies mag, hangt van de dag af.   Op *Vandaag* en op een
  [datumpagina]({{% ref "/uitleg/datumpagina" %}}) staat **één** label vóór
  de knop Nieuw/Oud. Dat is óf een echte vastenregel (*streng*, *vis*,
  *vastenvrij*, …), óf het grijze **geen vasten** als er vandaag niets over
  vasten is voorgeschreven (zoals een dinsdag in juli). Wijst u op het
  label, dan verschijnt een korte uitleg. Er worden geen twee vasten tegelijk
  getoond: als een dag in de Grote Vasten valt, is dat het vasten van die
  dag, niet nog eens het wekelijkse vrijdagvasten.

  Deze pagina is bedoeld om samen met de clerus te lezen. Zij beschrijft waar
  de regels vandaan komen en hoe de kalender ze toepast. Het is geen biechtregel.
  Economia en de zegen van de biechtvader gaan altijd vóór een website.
bronkeuze: |
  We volgen in de eerste plaats het **Slavische typikon**, zoals de
  Russisch-Orthodoxe Kerk in Moskou het hanteert: de hoofdstukken 32 en 33 van
  het Typikon (en hoofdstuk 49 voor Lazarus-zaterdag), de kerkelijke kalender van
  de Uitgeverij van het Moskouse Patriarchaat
  ([calendar.rop.ru](http://calendar.rop.ru)) en de veelgebruikte dagkalender
  [days.pravoslavie.ru](https://days.pravoslavie.ru/).

  Ontbreekt daar een duidelijk voorschrift, of spreken bronnen elkaar tegen, dan
  kijken we naar de **ROCOR**. Die kerk gebruikt hetzelfde Sabbas-typikon. Een
  toegankelijke Engelse weergave is die van pater Seraphim Rose; de samenvatting
  van de OCA komt uit dezelfde Slavische traditie.

  De regels hier gaan over liturgische dagen: Aankondiging, Grote Week, en zo
  verder. Of de parochie die dagen op de nieuwe of de oude kalender viert, is een
  aparte keuze (de knop Nieuw/Oud op deze site).
niveaus:
  - id: streng
    label: streng
    betekenis: >
      Geen vlees, zuivel, vis, wijn of olie. Droog eten en gekookt zonder olie
      vallen op deze site onder hetzelfde niveau.
  - id: wijn_olie
    label: wijn en olie
    betekenis: >
      Wijn en plantaardige olie zijn toegestaan; vis niet. Kaviaar op
      Lazarus-zaterdag rekenen we hiertoe, omdat we kaviaar niet apart tonen.
  - id: vis
    label: vis
    betekenis: Vis, wijn en olie zijn toegestaan; vlees en zuivel niet.
  - id: lichter
    label: lichter
    betekenis: >
      Alleen vlees is uitgesloten (zoals in de Boterweek, waar zuivel wel mag).
      In het Apostelen- en Geboortevasten is dit geen dagniveau: daar geldt een
      weekschema van streng, wijn en olie, of vis.
  - id: vrij
    label: vastenvrij
    betekenis: >
      De Kerk zet het vasten uit: u mag alles eten, ook op woensdag of
      vrijdag (zoals in de Lichte Week, met Kerst of Theofanie). Dat is
      iets anders dan *geen vasten*, waarbij er eenvoudig geen regel is.
geen_regel:
  label: geen vasten
  betekenis: >
    Er geldt geen vastenregel: het is geen woensdag of vrijdag, u zit niet
    in een vastenperiode, en de Kerk zet het vasten ook niet uit. Op de
    jaarkalender blijft die dag zonder rood of groen. In de agenda-app
    staat er dan niets over vasten.
regels:
  - id: periode-boven-wekelijks
    titel: Een vastenperiode vervangt woensdag- en vrijdagvasten
    tekst: |
      Woensdag- en vrijdagvasten gelden het hele jaar, tenzij de dag al in een
      vastenperiode of een vastenvrije periode valt. Dan is die periode het vasten
      van de dag. Het wekelijkse vasten wordt niet nog eens apart genoemd, niet op
      de datumpagina, niet in de jaarkalender en niet in de agenda.
    voorbeelden:
      - datum: "2026-03-20"
        verwachte_niveau: streng
        toelichting: Vrijdag in de Grote Vasten; het wekelijkse vrijdagvasten wordt niet apart getoond.
      - datum: "2026-08-07"
        verwachte_niveau: streng
        toelichting: Vrijdag in het Ontslapen-vasten.
      - datum: "2026-07-14"
        verwachte_niveau: null
        toelichting: Dinsdag in juli; geen vastenperiode en geen woensdag of vrijdag.
      - datum: "2026-07-15"
        verwachte_niveau: wijn_olie
        toelichting: Woensdag in juli; wekelijks woensdagvasten.
  - id: streng-weekend-olie
    titel: Zaterdag en zondag in een strenge periode
    tekst: |
      In de Grote Vasten en het Ontslapen-vasten is een gewone weekdag streng.
      Op zaterdag en zondag zijn wijn en olie toegestaan, vis niet. In de
      **Grote Week** geldt die weekendversoepeling niet: die dagen blijven streng.
    voorbeelden:
      - datum: "2026-03-21"
        verwachte_niveau: wijn_olie
        toelichting: Zaterdag in de Grote Vasten.
      - datum: "2026-04-11"
        verwachte_niveau: streng
        toelichting: Grote Zaterdag; geen weekendversoepeling.
      - datum: "2026-04-10"
        verwachte_niveau: streng
        toelichting: Grote Vrijdag.
  - id: lichter-weekschema
    titel: Apostelen- en Geboortevasten
    tekst: |
      In het Apostelen- en het Geboortevasten volgt de kalender het weekschema
      uit typikon hoofdstuk 33: maandag, woensdag en vrijdag streng; dinsdag en
      donderdag wijn en olie; zaterdag en zondag vis.

      De Boterweek hoort daar niet bij. Dat is de week vóór de Grote Vasten:
      geen vlees, wel zuivel, ook op woensdag en vrijdag.
    voorbeelden:
      - datum: "2026-11-20"
        verwachte_niveau: streng
        toelichting: Vrijdag in het Geboortevasten.
      - datum: "2026-11-17"
        verwachte_niveau: wijn_olie
        toelichting: Dinsdag in het Geboortevasten.
      - datum: "2026-02-20"
        verwachte_niveau: lichter
        toelichting: Vrijdag in de Boterweek (zuivel, geen vlees).
  - id: geboortevasten-20-24
    titel: Geboortevasten van 20 tot en met 24 december
    tekst: |
      Van 20 tot en met 24 december (op de feestdatum) is vis niet toegestaan,
      ook niet op zaterdag of zondag. Dat staat in typikon hoofdstuk 33. De
      kalender toont dan wijn en olie.
    voorbeelden:
      - datum: "2026-12-20"
        verwachte_niveau: wijn_olie
        toelichting: Zondag 20 december, nog Geboortevasten, geen vis.
  - id: feest-versoepelt
    titel: Een feest versoepelt, het maakt de periode niet strenger
    tekst: |
      Valt een feestdag in een vastenperiode, dan mag het feest het vasten
      lichter maken, nooit zwaarder. Zo is er vis op de Aankondiging (zolang die
      niet in de Grote Week valt), op Palmzondag, op de Transfiguratie en op de
      Tempelgang van de Moeder Gods. Op woensdag of vrijdag buiten een periode
      kan vis ook bij de Geboorte van de Moeder Gods, Petrus en Paulus, en de
      Geboorte van Johannes.
    voorbeelden:
      - datum: "2026-03-25"
        verwachte_niveau: vis
        toelichting: Aankondiging op woensdag in de Grote Vasten.
      - datum: "2026-08-06"
        verwachte_niveau: vis
        toelichting: Transfiguratie in het Ontslapen-vasten.
      - datum: "2026-11-21"
        verwachte_niveau: vis
        toelichting: Tempelgang, een zaterdag in het Geboortevasten (vis volgt al uit het weekschema).
      - datum: "2026-04-05"
        verwachte_niveau: vis
        toelichting: Palmzondag, tussen de Grote Vasten en de Grote Week.
  - id: lazarus-geen-vis
    titel: Lazarus-zaterdag
    tekst: |
      Volgens typikon hoofdstuk 49 is op Lazarus-zaterdag gekookt voedsel met
      olie toegestaan, plus wijn, en kaviaar als die er is. **Vis is er niet.**
      Vis hoort bij Palmzondag, de dag erna. Omdat deze kalender kaviaar niet
      apart kan tonen, laat zij Lazarus-zaterdag zien als wijn en olie, net als
      andere zaterdagen in de Grote Vasten.
    voorbeelden:
      - datum: "2026-04-04"
        verwachte_niveau: wijn_olie
        toelichting: Lazarus-zaterdag in 2026.
  - id: grote-week-cap
    titel: In de Grote Week geen vis, ook niet op de Aankondiging
    tekst: |
      Valt de Aankondiging in de Grote Week, dan is vis niet toegestaan. Het
      typikon staat tot Grote Donderdag olie en wijn toe; op Grote Vrijdag alleen
      wijn. Deze kalender gaat in de hele Grote Week niet verder dan wijn en olie
      als een feest anders vis zou geven.

      Op de nieuwe kalender valt 25 maart zelden in de Grote Week. Op de oude
      kalender kan dat wel, bijvoorbeeld in 2026.
    voorbeelden:
      - weekday: 2
        mmdd: "03-25"
        verwachte_niveau: wijn_olie
        toelichting: "Voorbeeld voor overleg: Aankondiging op Grote Dinsdag."
        entries:
          - id: grote-week
            soort: vasten
            vorm: periode
            vastenniveau: streng
            naam: Grote Week
          - id: aankondiging
            soort: feest
            vorm: dag
            vastenniveau: vis
            naam: Aankondiging aan de Moeder Gods
            observances: [feest]
  - id: vastenfeest-buiten-periode
    titel: Sommige feesten zijn zelf een vastendag
    tekst: |
      Buiten een vastenperiode zijn er feesten die zelf vasten meebrengen: de
      Kruisverheffing en de Onthoofding van Johannes. Die dagen zijn streng, ook
      als ze op zaterdag of zondag vallen.

      Andere feesten maken alleen het wekelijkse woensdag- of vrijdagvasten
      lichter (vis), of zetten het uit. Met Kerst en Theofanie is er geen vasten,
      ook niet als die dagen op vrijdag vallen.
    voorbeelden:
      - datum: "2026-09-14"
        verwachte_niveau: streng
        toelichting: Kruisverheffing op maandag.
      - datum: "2026-08-29"
        verwachte_niveau: streng
        toelichting: Onthoofding van Johannes op zaterdag.
      - datum: "2026-12-25"
        verwachte_niveau: vrij
        toelichting: Kerst op vrijdag; geen vrijdagvasten.
      - datum: "2026-09-08"
        verwachte_niveau: null
        toelichting: Geboorte van de Moeder Gods op dinsdag; die dag is geen vastendag.
  - id: vastenvrije-weken
    titel: Vastenvrije weken
    tekst: |
      In de Lichte Week, de week van de Tollenaar en de Farizeeër, en de week na
      Pinksteren is er geen vasten. Woensdag en vrijdag tellen dan niet als
      vastendagen.
    voorbeelden:
      - datum: "2026-04-13"
        verwachte_niveau: vrij
        toelichting: Maandag van de Lichte Week.
vereenvoudigingen:
  - >
    Droog eten en gekookt voedsel zonder olie vallen beide onder «streng». De
    kalender telt niet hoeveel maaltijden er op een dag zijn.
  - >
    Kaviaar op Lazarus-zaterdag heeft geen eigen weergave; de kalender toont
    wijn en olie.
  - >
    Als de Aankondiging op Grote Vrijdag valt, onderscheidt de kalender «alleen
    wijn» niet van «wijn en olie».
  - >
    Schelpdieren (zonder ruggengraat) staan niet apart in de kalender. Wie ze op
    een strenge dag eet, volgt de lokale zegen, niet deze site.
nog_niet:
  - >
    Olie of wijn op middelfeesten in de Grote Vasten, zoals de veertig martelaren
    van Sebaste of het voorfeest van de Aankondiging.
  - >
    Vis op een heilige met doxologie of wake in het Apostelen- of Geboortevasten
    (typikon hoofdstuk 33, naar de rang van de dienst).
  - >
    Grote Donderdag: het typikon staat wijn en olie toe; de kalender laat de
    Grote Week streng, behalve als de Aankondiging daar valt (dan wijn en olie).
  - >
    De vooravond van Theofanie als aparte strenge dag.
  - >
    Het tempelfeest van de parochie: vis of olie op die dag.
technisch:
  titel: Vasten (technisch)
  beschrijving: Koppeling tussen de vastenuitleg, de YAML-regels en de kalendercode
  inleiding: |
    Dit is de technische bijlage bij de [vastenuitleg voor overleg]({{% ref "/uitleg/vasten" %}}).
    De cleruspagina beschrijft de regels in gewone taal. Hier staat hoe die regels
    in de site vastliggen, zodat een wijziging in de voorbeelden de tests rood
    maakt tot de code meegaat.

    Bronbestand: `data/regels/vasten.yaml`. Daarna `python3 scripts/generate.py`
    (beide uitlegpagina’s worden opnieuw geschreven). De mengregel staat in
    `scripts/vasten.py` en, gespiegeld, in `site/assets/js/calendar.js`.
    How-to: [vastenregels wijzigen]({{% ref "/beheer/how-to-vasten" %}}).
