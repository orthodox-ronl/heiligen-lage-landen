{{ define "main" }}
<section class="kalender-page" data-kalender>
  <h1 class="kalender-page-title">{{ .Title }}</h1>
  <div class="kalender-sticky-head">
    <ul class="legend compact" aria-label="Legenda">
      <li><span class="swatch day-feest"></span> feest</li>
      <li><span class="swatch day-heilige"></span> heilige</li>
      <li><span class="swatch day-beide"></span> beide</li>
      <li><span class="swatch day-vasten"></span> vasten</li>
      <li><span class="swatch day-feest-vasten"></span> feest+vasten</li>
      <li><span class="swatch day-heilige-vasten"></span> heilige+vasten</li>
      <li><span class="swatch day-today"></span> vandaag</li>
    </ul>
    <div class="kalender-sticky-style" id="kalender-style-slot"></div>
  </div>
  {{ .Content }}
  <div id="year-grid" class="year-grid"></div>
</section>
{{ end }}
