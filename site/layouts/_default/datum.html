  <div class="today-card" id="today-card" aria-live="polite">

        <a href="{{ "synaxarion/" | relURL }}">Synaxarion</a>.
      </p>
    </div>
  </div>
</section>
{{ partial "entries-json.html" . }}
{{ end }}
