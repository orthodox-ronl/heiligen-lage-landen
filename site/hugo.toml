  github = "https://github.com/orthodox-ronl/heiligen-lage-landen"
  org = "https://github.com/orthodox-ronl"
  feedback_email = "orthodoxronl@duck.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
